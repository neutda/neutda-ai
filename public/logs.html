<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>neutda-ai · 로그</title>
        <style>
            :root {
                --bg: #0f1117;
                --panel: #171a23;
                --border: #272b38;
                --text: #e7e9ee;
                --muted: #9aa3b2;
                --accent: #6c8cff;
                --ok: #3fb950;
                --err: #f85149;
                --warn: #d29922;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                font-family:
                    ui-sans-serif, system-ui, "Segoe UI", "Malgun Gothic",
                    sans-serif;
                background: var(--bg);
                color: var(--text);
                height: 100vh;
                display: flex;
                flex-direction: column;
            }
            header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px 14px;
                padding: 6px 16px;
                border-bottom: 1px solid var(--border);
                flex-wrap: nowrap;
                flex: 0 0 auto;
                background: var(--bg);
                min-height: 40px;
                overflow: visible;
                position: relative;
                z-index: 30;
            }
            .top-left {
                display: flex;
                align-items: center;
                gap: 10px;
                flex-wrap: nowrap;
                min-width: 0;
                flex: 0 1 auto;
                max-width: min(42%, 420px);
                overflow: visible;
            }
            h1 {
                font-size: 15px;
                margin: 0;
                white-space: nowrap;
                flex: 0 0 auto;
            }
            .src-inline {
                display: flex;
                align-items: center;
                gap: 8px;
                min-width: 0;
                flex: 1 1 auto;
                overflow: hidden;
                font-size: 12px;
                font-weight: 600;
                color: var(--text);
            }
            .src-inline #srcLabel {
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                min-width: 0;
                flex: 0 1 auto;
            }
            .src-inline .hint {
                font-weight: 400;
                color: var(--muted);
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                min-width: 0;
                flex: 1 1 auto;
            }
            a {
                color: var(--accent);
                text-decoration: none;
                font-size: 13px;
            }
            .tools {
                display: flex;
                align-items: center;
                gap: 8px;
                flex-wrap: nowrap;
                flex: 1 1 auto;
                justify-content: flex-end;
                min-width: 0;
                overflow-x: auto;
                overflow-y: hidden;
            }
            .btn {
                font-size: 12px;
                padding: 5px 10px;
                border-radius: 7px;
                border: 1px solid var(--border);
                background: var(--panel);
                color: var(--text);
                cursor: pointer;
            }
            .btn:hover {
                border-color: var(--accent);
            }
            .btn-danger {
                background: rgba(248, 81, 73, 0.14);
                border-color: rgba(248, 81, 73, 0.4);
                color: #ff9c95;
            }
            .updated {
                font-size: 11px;
                color: var(--muted);
                white-space: nowrap;
            }
            .tools label {
                font-size: 11px;
                color: var(--muted);
            }
            .tools input,
            .tools select {
                background: #0d0f15;
                border: 1px solid var(--border);
                border-radius: 6px;
                color: var(--text);
                padding: 5px 8px;
                font-size: 12px;
                font-family: inherit;
            }
            .tools input#fText {
                flex: 1 1 140px;
                min-width: 120px;
                max-width: 280px;
            }
            .date-nav {
                display: inline-flex;
                align-items: center;
                gap: 4px;
            }
            .date-nav .btn {
                padding: 4px 8px;
                min-width: 28px;
            }
            .tools input#fDate {
                padding: 4px 6px;
            }
            .tools select#fDateList {
                max-width: 140px;
            }
            .badge-live,
            .badge-arch {
                font-size: 10px;
                font-weight: 700;
                letter-spacing: 0.04em;
                padding: 2px 7px;
                border-radius: 999px;
                border: 1px solid var(--border);
            }
            .badge-live {
                color: var(--ok);
                border-color: rgba(63, 185, 80, 0.45);
                background: rgba(63, 185, 80, 0.12);
            }
            .badge-arch {
                color: var(--muted);
                background: rgba(255, 255, 255, 0.04);
            }
            .settings-wrap {
                position: relative;
                flex: 0 0 auto;
            }
            .btn-gear {
                width: 32px;
                height: 32px;
                padding: 0;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                font-size: 16px;
                line-height: 1;
            }
            .btn-gear[aria-expanded="true"] {
                border-color: var(--accent);
                color: var(--accent);
            }
            .settings-panel {
                display: none;
                position: absolute;
                top: calc(100% + 6px);
                left: 0;
                z-index: 50;
                width: 280px;
                padding: 12px 14px 14px;
                background: #12151e;
                border: 1px solid var(--border);
                border-radius: 10px;
                box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
            }
            .settings-panel.open {
                display: block;
            }
            .settings-panel h3 {
                margin: 0 0 10px;
                font-size: 12px;
                font-weight: 700;
                color: var(--muted);
                text-transform: uppercase;
                letter-spacing: 0.05em;
            }
            .settings-panel .row-opt {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
                padding: 6px 0;
                font-size: 13px;
            }
            .settings-panel .row-opt label {
                display: flex;
                align-items: center;
                gap: 8px;
                cursor: pointer;
                color: var(--text);
                font-size: 13px;
            }
            .settings-panel .row-opt input[type="checkbox"] {
                accent-color: var(--accent);
                width: 15px;
                height: 15px;
            }
            .settings-panel .row-opt.locked label {
                cursor: default;
                color: #ff9c95;
            }
            .settings-panel .row-opt.locked input {
                accent-color: var(--err);
            }
            .settings-panel .hint-locked {
                font-size: 10px;
                color: var(--muted);
            }
            .settings-panel .sep {
                height: 1px;
                background: var(--border);
                margin: 8px 0;
            }
            .settings-panel select {
                background: #0d0f15;
                border: 1px solid var(--border);
                border-radius: 6px;
                color: var(--text);
                padding: 4px 8px;
                font-size: 12px;
            }
            .layout {
                flex: 1;
                display: grid;
                grid-template-columns: 220px 1fr;
                min-height: 0;
            }
            .lnb {
                border-right: 1px solid var(--border);
                overflow-y: auto;
                background: #0c0e14;
                padding: 10px 8px;
            }
            .lnb-sec {
                font-size: 11px;
                color: var(--muted);
                padding: 10px 8px 4px;
                text-transform: uppercase;
                letter-spacing: 0.04em;
            }
            .lnb-item {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 8px 10px;
                border-radius: 8px;
                cursor: pointer;
                font-size: 13px;
                color: var(--muted);
            }
            .lnb-item.nested {
                padding-left: 28px;
                font-size: 12px;
            }
            .lnb-item.nested .dot {
                width: 5px;
                height: 5px;
            }
            .lnb-item .meta {
                margin-left: auto;
                font-size: 10px;
                color: var(--muted);
                opacity: 0.8;
            }
            .lnb-item:hover {
                background: #171a23;
                color: var(--text);
            }
            .lnb-item.active {
                background: rgba(108, 140, 255, 0.16);
                color: var(--accent);
                font-weight: 600;
            }
            .lnb-item .dot {
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background: var(--muted);
                flex: 0 0 auto;
            }
            .lnb-item.kind-express .dot {
                background: var(--accent);
            }
            .lnb-item.kind-agent .dot {
                background: var(--ok);
            }
            .lnb-item.kind-llama .dot {
                background: var(--warn);
            }
            .lnb-item.kind-all .dot {
                background: #c9d1d9;
            }
            .lnb-item.dead {
                opacity: 0.55;
            }
            .src-tag.kind-express {
                color: var(--accent);
                background: rgba(108, 140, 255, 0.12);
            }
            .src-tag.kind-agent {
                color: var(--ok);
                background: rgba(63, 185, 80, 0.12);
            }
            .src-tag.kind-llama {
                color: var(--warn);
                background: rgba(210, 153, 34, 0.14);
            }
            .main {
                display: flex;
                flex-direction: column;
                min-height: 0;
                min-width: 0;
            }
            .grid {
                flex: 1;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 0;
                min-height: 0;
            }
            .col {
                display: flex;
                flex-direction: column;
                min-height: 0;
                border-right: 1px solid var(--border);
            }
            .col:last-child {
                border-right: 0;
            }
            .col-head {
                padding: 5px 14px;
                font-size: 12px;
                font-weight: 600;
                border-bottom: 1px solid var(--border);
                display: flex;
                justify-content: space-between;
                align-items: center;
                background: #0c0e14;
            }
            .col-head.err {
                color: var(--err);
            }
            .count {
                font-size: 11px;
                color: var(--muted);
                font-variant-numeric: tabular-nums;
            }
            .head-right {
                display: flex;
                align-items: center;
                gap: 8px;
            }
            .btn-dl {
                padding: 2px 8px;
                font-size: 11px;
            }
            .logs {
                flex: 1;
                overflow-y: auto;
                padding: 8px 0;
                font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
                font-size: 12.5px;
            }
            .row {
                display: flex;
                gap: 8px;
                padding: 3px 14px;
                white-space: pre-wrap;
                word-break: break-word;
                border-bottom: 1px solid rgba(39, 43, 56, 0.5);
                align-items: flex-start;
            }
            .row:hover {
                background: rgba(255, 255, 255, 0.03);
            }
            .row .copy {
                flex: 0 0 auto;
                margin-top: 1px;
                width: 22px;
                height: 22px;
                padding: 0;
                border: 1px solid transparent;
                border-radius: 5px;
                background: transparent;
                color: var(--muted);
                cursor: pointer;
                font-size: 12px;
                line-height: 1;
                opacity: 0.35;
            }
            .row:hover .copy {
                opacity: 0.9;
                border-color: var(--border);
                background: var(--panel);
            }
            .row .copy:hover {
                color: var(--accent);
                border-color: var(--accent);
            }
            .row .copy.ok {
                color: var(--ok);
                opacity: 1;
            }
            .ts {
                color: var(--muted);
                flex: 0 0 auto;
            }
            .src-tag {
                flex: 0 0 auto;
                font-size: 10px;
                color: var(--muted);
                background: rgba(255, 255, 255, 0.04);
                border-radius: 4px;
                padding: 1px 5px;
                max-width: 110px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .lv {
                flex: 0 0 auto;
                font-weight: 700;
                width: 46px;
            }
            .lv-debug {
                color: var(--muted);
            }
            .lv-info {
                color: var(--accent);
            }
            .lv-warn {
                color: var(--warn);
            }
            .lv-error {
                color: var(--err);
            }
            .msg {
                flex: 1;
                min-width: 0;
            }
            .empty {
                color: var(--muted);
                padding: 14px 16px;
                font-size: 13px;
            }
            mark {
                background: rgba(210, 153, 34, 0.45);
                color: #fff;
                border-radius: 2px;
                padding: 0 1px;
            }
            @media (max-width: 900px) {
                .layout {
                    grid-template-columns: 1fr;
                }
                .lnb {
                    max-height: 160px;
                    border-right: 0;
                    border-bottom: 1px solid var(--border);
                }
                .grid {
                    grid-template-columns: 1fr;
                }
            }
        </style>
        <link rel="stylesheet" href="/nav.css" />
    </head>
    <body>
        <header>
            <div class="top-left">
                <h1>로그</h1>
                <div class="settings-wrap">
                    <button
                        type="button"
                        class="btn btn-gear"
                        id="btnSettings"
                        title="로그 설정"
                        aria-label="로그 설정"
                        aria-expanded="false"
                        aria-controls="settingsPanel"
                    >
                        ⚙
                    </button>
                    <div class="settings-panel" id="settingsPanel" role="dialog" aria-label="로그 설정">
                        <h3>표시 레벨</h3>
                        <div class="row-opt locked">
                            <label>
                                <input type="checkbox" id="optLvError" checked disabled />
                                error
                            </label>
                            <span class="hint-locked">항상 표시</span>
                        </div>
                        <div class="row-opt">
                            <label>
                                <input type="checkbox" id="optLvWarn" data-level="warn" checked />
                                warn
                            </label>
                        </div>
                        <div class="row-opt">
                            <label>
                                <input type="checkbox" id="optLvInfo" data-level="info" checked />
                                info
                            </label>
                        </div>
                        <div class="row-opt">
                            <label>
                                <input type="checkbox" id="optLvDebug" data-level="debug" checked />
                                debug
                            </label>
                        </div>
                        <div class="sep"></div>
                        <h3>기타</h3>
                        <div class="row-opt">
                            <span>자동 갱신</span>
                            <select id="optPollMs" title="LIVE 폴링 간격">
                                <option value="1000">1초</option>
                                <option value="2000" selected>2초</option>
                                <option value="5000">5초</option>
                                <option value="10000">10초</option>
                                <option value="0">끄기</option>
                            </select>
                        </div>
                        <div class="row-opt">
                            <label>
                                <input type="checkbox" id="optAutoScroll" checked />
                                하단 자동 스크롤
                            </label>
                        </div>
                    </div>
                </div>
                <span id="modeBadge" class="badge-live">LIVE</span>
                <div class="src-inline">
                    <span id="srcLabel">관리서버 (Express)</span>
                    <span class="hint" id="srcHint"></span>
                </div>
            </div>
            <div class="tools">
                <div class="date-nav">
                    <button type="button" class="btn" id="btnDayPrev" title="이전 날">‹</button>
                    <input id="fDate" type="date" />
                    <button type="button" class="btn" id="btnDayNext" title="다음 날">›</button>
                    <select id="fDateList" title="저장된 날짜" aria-label="저장된 날짜">
                        <option value="">저장된 날짜…</option>
                    </select>
                    <button type="button" class="btn" id="btnToday">오늘</button>
                </div>
                <input
                    id="fText"
                    type="text"
                    placeholder="텍스트 검색"
                />
                <button class="btn" id="btnFilterClear">검색 초기화</button>
                <button class="btn btn-danger" id="btnTestError">
                    오류 테스트
                </button>
                <button class="btn" id="btnClear">화면 지우기</button>
                <span class="updated" id="updated"></span>
            </div>
        </header>

        <div class="layout">
            <aside class="lnb" id="lnb">
                <div class="empty">소스 불러오는 중…</div>
            </aside>
            <div class="main">
                <div class="grid">
                    <div class="col">
                        <div class="col-head">
                            <span>전체 로그 <span class="count" id="fileAllHint" style="font-weight:400"></span></span>
                            <span class="head-right"
                                ><button type="button" class="btn btn-dl" id="btnDlAll" title="현재 필터의 전체 로그를 .log 파일로 저장">⭳ .log</button
                                ><span class="count" id="cAll">0건</span></span>
                        </div>
                        <div class="logs" id="allLogs">
                            <div class="empty">로그 대기 중…</div>
                        </div>
                    </div>
                    <div class="col">
                        <div class="col-head err">
                            <span>오류 로그 <span class="count" id="fileErrHint" style="font-weight:400;color:var(--muted)"></span></span>
                            <span class="head-right"
                                ><button type="button" class="btn btn-dl" id="btnDlErr" title="현재 필터의 오류 로그를 .log 파일로 저장">⭳ .log</button
                                ><span class="count" id="cErr">0건</span></span>
                        </div>
                        <div class="logs" id="errLogs">
                            <div class="empty">오류 없음</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            const $ = (id) => document.getElementById(id);
            const esc = (s) =>
                String(s ?? "").replace(
                    /[&<>"']/g,
                    (c) =>
                        ({
                            "&": "&amp;",
                            "<": "&lt;",
                            ">": "&gt;",
                            '"': "&quot;",
                            "'": "&#39;",
                        })[c],
                );

            let sources = [];
            let selected = "all";
            let hideBeforeTs = 0;
            let lastAll = [];
            let lastErr = [];
            let showSourceTag = true;
            let todayKey = localDayKey(new Date());
            let availableDates = [];
            let pollTimer = null;

            const SETTINGS_KEY = "logsUiSettings";
            const defaultSettings = () => ({
                levels: { error: true, warn: true, info: true, debug: true },
                pollMs: 2000,
                autoScroll: true,
            });

            function loadSettings() {
                try {
                    const raw = JSON.parse(
                        localStorage.getItem(SETTINGS_KEY) || "null",
                    );
                    const d = defaultSettings();
                    if (!raw || typeof raw !== "object") return d;
                    return {
                        levels: {
                            error: true, // 항상 표시
                            warn: raw.levels?.warn !== false,
                            info: raw.levels?.info !== false,
                            debug: raw.levels?.debug !== false,
                        },
                        pollMs: [0, 1000, 2000, 5000, 10000].includes(
                            Number(raw.pollMs),
                        )
                            ? Number(raw.pollMs)
                            : 2000,
                        autoScroll: raw.autoScroll !== false,
                    };
                } catch {
                    return defaultSettings();
                }
            }

            let settings = loadSettings();

            function saveSettings() {
                settings.levels.error = true;
                localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
            }

            function applySettingsToUi() {
                $("optLvError").checked = true;
                $("optLvWarn").checked = !!settings.levels.warn;
                $("optLvInfo").checked = !!settings.levels.info;
                $("optLvDebug").checked = !!settings.levels.debug;
                $("optPollMs").value = String(settings.pollMs);
                $("optAutoScroll").checked = !!settings.autoScroll;
            }

            function readSettingsFromUi() {
                settings.levels = {
                    error: true,
                    warn: $("optLvWarn").checked,
                    info: $("optLvInfo").checked,
                    debug: $("optLvDebug").checked,
                };
                settings.pollMs = Number($("optPollMs").value) || 0;
                settings.autoScroll = $("optAutoScroll").checked;
                saveSettings();
                applyRender();
                restartPoll();
            }

            function levelAllowed(level) {
                const lv = String(level || "info").toLowerCase();
                if (lv === "error") return true;
                if (settings.levels[lv] === false) return false;
                // 알 수 없는 레벨은 info 취급
                if (!["warn", "info", "debug", "error"].includes(lv)) {
                    return settings.levels.info !== false;
                }
                return true;
            }

            function restartPoll() {
                if (pollTimer) {
                    clearInterval(pollTimer);
                    pollTimer = null;
                }
                if (settings.pollMs > 0) {
                    pollTimer = setInterval(() => {
                        if (isLiveDay()) refresh();
                    }, settings.pollMs);
                }
            }

            function toggleSettings(force) {
                const panel = $("settingsPanel");
                const btn = $("btnSettings");
                const open =
                    force === true
                        ? true
                        : force === false
                          ? false
                          : !panel.classList.contains("open");
                panel.classList.toggle("open", open);
                btn.setAttribute("aria-expanded", open ? "true" : "false");
            }

            function localDayKey(d) {
                const y = d.getFullYear();
                const m = String(d.getMonth() + 1).padStart(2, "0");
                const day = String(d.getDate()).padStart(2, "0");
                return `${y}-${m}-${day}`;
            }

            function shiftDay(key, delta) {
                const [y, m, d] = key.split("-").map(Number);
                const dt = new Date(y, m - 1, d);
                dt.setDate(dt.getDate() + delta);
                return localDayKey(dt);
            }

            function selectedDate() {
                return $("fDate").value || todayKey;
            }

            function isLiveDay() {
                return selectedDate() === todayKey;
            }

            function updateModeBadge() {
                const b = $("modeBadge");
                if (isLiveDay()) {
                    b.className = "badge-live";
                    b.textContent = "LIVE";
                } else {
                    b.className = "badge-arch";
                    b.textContent = "파일";
                }
                $("btnDayNext").disabled = selectedDate() >= todayKey;
            }

            function fillDateList(dates) {
                availableDates = dates || [];
                const sel = $("fDateList");
                const cur = selectedDate();
                sel.innerHTML =
                    `<option value="">저장된 날짜 (${availableDates.length})</option>` +
                    availableDates
                        .map(
                            (d) =>
                                `<option value="${esc(d)}"${d === cur ? " selected" : ""}>${esc(d)}${d === todayKey ? " (오늘)" : ""}</option>`,
                        )
                        .join("");
            }

            const highlight = (msg, q) => {
                const safe = esc(msg);
                if (!q) return safe;
                const re = new RegExp(
                    "(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")",
                    "gi",
                );
                return safe.replace(re, "<mark>$1</mark>");
            };

            function shortSource(e) {
                const s = e.source;
                if (!s) return "";
                if (s.kind === "express") return "관리서버";
                if (s.kind === "agent") return `agent:${s.agentId || "?"}`;
                if (s.kind === "llama")
                    return `${s.alias || s.name || "llama"}:${s.port || "?"}`;
                return s.id || "";
            }

            function rowHtml(e, q) {
                const t = e.ts
                    ? new Date(e.ts).toLocaleTimeString("ko-KR", {
                          hour12: false,
                      })
                    : "--:--:--";
                const kind = e.source?.kind || "";
                const tag = showSourceTag
                    ? `<span class="src-tag kind-${esc(kind)}" title="${esc(e.source?.label || "")}">${esc(shortSource(e))}</span>`
                    : "";
                const src = shortSource(e);
                const plain = [
                    e.ts || "",
                    src,
                    String(e.level || "info").toUpperCase(),
                    e.message ?? "",
                ]
                    .filter(Boolean)
                    .join("\t");
                return `<div class="row"><button type="button" class="copy" title="이 줄 복사" aria-label="복사" data-copy="${esc(plain)}">⧉</button><span class="ts">${t}</span>${tag}<span class="lv lv-${e.level}">${esc(String(e.level || "info").toUpperCase())}</span><span class="msg">${highlight(e.message, q)}</span></div>`;
            }

            function currentFilter() {
                const q = $("fText").value.trim().toLowerCase();
                return { q };
            }

            function passes(e, f) {
                if (hideBeforeTs && new Date(e.ts || 0).getTime() <= hideBeforeTs)
                    return false;
                if (!levelAllowed(e.level)) return false;
                if (f.q && !String(e.message).toLowerCase().includes(f.q))
                    return false;
                return true;
            }

            function render(el, items, emptyText, f) {
                const shown = items.filter((e) => passes(e, f));
                if (shown.length === 0) {
                    el.innerHTML = `<div class="empty">${emptyText}</div>`;
                    return 0;
                }
                const atBottom =
                    el.scrollHeight - el.scrollTop - el.clientHeight < 40;
                el.innerHTML = shown.map((e) => rowHtml(e, f.q)).join("");
                if (settings.autoScroll && atBottom)
                    el.scrollTop = el.scrollHeight;
                return shown.length;
            }

            function applyRender() {
                const f = currentFilter();
                const active = !!f.q;
                const levelOff =
                    !settings.levels.warn ||
                    !settings.levels.info ||
                    !settings.levels.debug;
                const suffix = active || levelOff ? "건(필터)" : "건";
                $("cAll").textContent =
                    render($("allLogs"), lastAll, "조건에 맞는 로그 없음", f) +
                    suffix;
                $("cErr").textContent =
                    render($("errLogs"), lastErr, "조건에 맞는 오류 없음", f) +
                    (active ? "건(필터)" : "건");
            }

            // 현재 필터(passes)를 통과한 항목을 사람이 읽는 로그 텍스트로.
            function toLogText(items, f) {
                return items
                    .filter((e) => passes(e, f))
                    .map((e) => {
                        const ts = e.ts || "";
                        const src = shortSource(e);
                        const lv = String(e.level || "info").toUpperCase();
                        return [ts, src, lv, e.message ?? ""]
                            .filter((x) => x !== "")
                            .join("\t");
                    })
                    .join("\n");
            }

            // 현재 화면에 보이는(필터 적용된) 로그를 .log 파일로 저장.
            // kind: "all"=전체 로그, "err"=오류 로그.
            function downloadLog(kind) {
                const f = currentFilter();
                const items = kind === "err" ? lastErr : lastAll;
                const text = toLogText(items, f);
                if (!text) {
                    $("updated").textContent =
                        (kind === "err" ? "오류" : "전체") +
                        " 로그: 저장할 내용이 없습니다";
                    return;
                }
                const srcTag =
                    selected === "all"
                        ? "all-servers"
                        : String(selected).replace(/[^a-zA-Z0-9._-]+/g, "-");
                const name = `${kind === "err" ? "error" : "all"}_${srcTag}_${selectedDate()}.log`;
                const blob = new Blob([text + "\n"], {
                    type: "text/plain;charset=utf-8",
                });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = name;
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
                const n = text.split("\n").length;
                $("updated").textContent = `${name} 저장 (${n}줄)`;
            }

            function fmtBytes(n) {
                if (!n) return "";
                if (n < 1024) return `${n}B`;
                if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)}KB`;
                return `${(n / (1024 * 1024)).toFixed(1)}MB`;
            }

            function updateFileHints(files) {
                if (!files) {
                    $("fileAllHint").textContent = "";
                    $("fileErrHint").textContent = "";
                    return;
                }
                const allName = files.allPath
                    ? files.allPath.split(/[/\\]/).pop()
                    : `all-*-${files.date || selectedDate()}.jsonl`;
                const errName = files.errorPath
                    ? files.errorPath.split(/[/\\]/).pop()
                    : `error-*-${files.date || selectedDate()}.jsonl`;
                $("fileAllHint").textContent = files.hasAll
                    ? `· ${allName} ${fmtBytes(files.allBytes)}`
                    : `· ${allName} (없음)`;
                $("fileErrHint").textContent = files.hasError
                    ? `· ${errName} ${fmtBytes(files.errorBytes)}`
                    : `· ${errName} (없음)`;
            }

            function lnbItem(s, { nested = false } = {}) {
                const dead = s.unreachable ? " dead" : "";
                const nest = nested ? " nested" : "";
                const meta =
                    s.kind === "agent"
                        ? `<span class="meta">${sources.filter((x) => x.kind === "llama" && x.agentId === s.agentId).length}</span>`
                        : s.kind === "llama" && s.port
                          ? `<span class="meta">:${s.port}</span>`
                          : "";
                const label =
                    s.kind === "llama"
                        ? s.alias || s.name || s.label
                        : s.label;
                return `<div class="lnb-item kind-${esc(s.kind)}${nest}${dead}${selected === s.id ? " active" : ""}" data-src="${esc(s.id)}"><span class="dot"></span><span>${esc(label)}</span>${meta}</div>`;
            }

            function renderLnb() {
                const html = [];
                html.push(`<div class="lnb-sec">종합</div>`);
                html.push(
                    lnbItem({
                        id: "all",
                        kind: "all",
                        label: "전체 서버",
                    }),
                );

                const express = sources.filter((s) => s.kind === "express");
                if (express.length) {
                    html.push(`<div class="lnb-sec">관리서버</div>`);
                    for (const s of express) html.push(lnbItem(s));
                }

                const agents = sources.filter((s) => s.kind === "agent");
                const orphanLlamas = sources.filter(
                    (s) =>
                        s.kind === "llama" &&
                        !agents.some((a) => a.agentId === s.agentId),
                );

                if (agents.length || orphanLlamas.length) {
                    html.push(`<div class="lnb-sec">하위 관리서버</div>`);
                }
                for (const a of agents) {
                    html.push(lnbItem(a));
                    const models = sources.filter(
                        (s) => s.kind === "llama" && s.agentId === a.agentId,
                    );
                    for (const m of models) html.push(lnbItem(m, { nested: true }));
                }
                if (orphanLlamas.length) {
                    for (const m of orphanLlamas) html.push(lnbItem(m, { nested: true }));
                }

                $("lnb").innerHTML = html.join("");
            }

            function setSrcLabel(text, hint) {
                const el = $("srcLabel");
                el.textContent = text;
                el.title = text || "";
                if (hint != null) {
                    $("srcHint").textContent = hint;
                    $("srcHint").title = hint;
                }
            }

            function selectSource(id) {
                selected = id;
                const s = sources.find((x) => x.id === id);
                showSourceTag = id === "all";
                if (id === "all") {
                    const nA = sources.filter((x) => x.kind === "agent").length;
                    const nL = sources.filter((x) => x.kind === "llama").length;
                    setSrcLabel(
                        "전체 서버",
                        `관리서버 + 하위 ${nA} · 모델 ${nL} · ${selectedDate()}`,
                    );
                } else if (s?.kind === "llama") {
                    setSrcLabel(
                        s.label,
                        `하위 ${s.agentId || "?"} · llama 파일 · ${selectedDate()}`,
                    );
                } else if (s?.kind === "agent") {
                    const n = sources.filter(
                        (x) => x.kind === "llama" && x.agentId === s.agentId,
                    ).length;
                    setSrcLabel(
                        s.label,
                        `일별 파일 · 하위 모델 ${n}개 · ${selectedDate()}`,
                    );
                } else {
                    setSrcLabel(
                        s?.label || id,
                        `일별 파일 all-/error-*.jsonl · ${selectedDate()}`,
                    );
                }
                hideBeforeTs = 0;
                renderLnb();
                refresh();
            }

            async function loadDates() {
                try {
                    const j = await (await fetch("/api/logs/dates")).json();
                    if (j.today) todayKey = j.today;
                    fillDateList(j.dates || []);
                    if (!$("fDate").value) $("fDate").value = todayKey;
                    updateModeBadge();
                } catch {
                    if (!$("fDate").value) $("fDate").value = todayKey;
                    updateModeBadge();
                }
            }

            async function loadSources() {
                try {
                    let j;
                    try {
                        j = await (await fetch("/api/logs/sources")).json();
                    } catch {
                        j = null;
                    }
                    if (!j?.sources) {
                        const ag = await (await fetch("/api/agents")).json();
                        const agents = ag.agents || [];
                        j = {
                            sources: [
                                {
                                    id: "express",
                                    kind: "express",
                                    label: "관리서버 (Express)",
                                },
                                ...agents.flatMap((a) => [
                                    {
                                        id: `agent:${a.id}`,
                                        kind: "agent",
                                        agentId: a.id,
                                        label: `하위 관리서버 ${a.id}`,
                                    },
                                    ...(a.servers || []).map((s) => ({
                                        id: `llama:${a.id}:${s.port}`,
                                        kind: "llama",
                                        agentId: a.id,
                                        port: s.port,
                                        name: s.name,
                                        alias: s.alias,
                                        label: `${s.alias || s.name} :${s.port}`,
                                    })),
                                ]),
                            ],
                        };
                    }
                    sources = j.sources || [];
                    if (j.today) todayKey = j.today;
                    if (Array.isArray(j.logDates)) fillDateList(j.logDates);
                    if (!sources.find((s) => s.id === "express")) {
                        sources.unshift({
                            id: "express",
                            kind: "express",
                            label: "관리서버 (Express)",
                        });
                    }
                    if (
                        !sources.find((s) => s.id === selected) &&
                        selected !== "all"
                    ) {
                        selected = "express";
                    }
                    renderLnb();
                    const cur =
                        selected === "all"
                            ? { label: "전체 서버" }
                            : sources.find((s) => s.id === selected);
                    setSrcLabel(cur?.label || selected);
                } catch (e) {
                    $("lnb").innerHTML = `<div class="empty">소스 조회 실패: ${esc(e.message)}</div>`;
                }
            }

            async function refresh() {
                try {
                    updateModeBadge();
                    const q = new URLSearchParams({
                        source: selected,
                        level: "all",
                        limit: selected === "all" ? "1000" : "800",
                        date: selectedDate(),
                    });
                    const r = await fetch(`/api/logs?${q}`);
                    const j = await r.json().catch(() => ({}));
                    if (j.today) todayKey = j.today;
                    lastAll = j.items || [];
                    lastErr = lastAll.filter((e) => e.level === "error");
                    updateFileHints(j.files);
                    applyRender();
                    if (!r.ok && j.error) {
                        $("allLogs").innerHTML = `<div class="empty">${esc(j.error)}</div>`;
                    }
                    if (selected === "all" && j.meta) {
                        const hint =
                            `${j.date || selectedDate()} · 관리서버 ${j.meta.express} · 하위노드 ${j.meta.agents} · 모델 ${j.meta.models} · 표시 ${j.meta.returned}/${j.meta.total}`;
                        $("srcHint").textContent = hint;
                        $("srcHint").title = hint;
                    }
                    $("updated").textContent =
                        (isLiveDay() ? "갱신 " : "조회 ") +
                        new Date().toLocaleTimeString("ko-KR", {
                            hour12: false,
                        });
                } catch (e) {
                    $("updated").textContent = "조회 실패: " + e.message;
                }
            }

            function onDateChange() {
                hideBeforeTs = 0;
                updateModeBadge();
                fillDateList(availableDates);
                refresh();
            }

            $("lnb").addEventListener("click", (ev) => {
                const el = ev.target.closest("[data-src]");
                if (!el) return;
                selectSource(el.dataset.src);
            });

            async function copyLogLine(btn) {
                const text = btn.getAttribute("data-copy") || "";
                try {
                    await navigator.clipboard.writeText(text);
                } catch {
                    const ta = document.createElement("textarea");
                    ta.value = text;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand("copy");
                    ta.remove();
                }
                btn.classList.add("ok");
                btn.textContent = "✓";
                setTimeout(() => {
                    btn.classList.remove("ok");
                    btn.textContent = "⧉";
                }, 900);
            }

            document.body.addEventListener("click", (ev) => {
                const btn = ev.target.closest("button.copy");
                if (!btn) return;
                ev.preventDefault();
                copyLogLine(btn);
            });

            $("fText").addEventListener("input", applyRender);
            $("btnSettings").addEventListener("click", (ev) => {
                ev.stopPropagation();
                toggleSettings();
            });
            $("settingsPanel").addEventListener("click", (ev) =>
                ev.stopPropagation(),
            );
            document.addEventListener("click", () => toggleSettings(false));
            document.addEventListener("keydown", (ev) => {
                if (ev.key === "Escape") toggleSettings(false);
            });
            ["optLvWarn", "optLvInfo", "optLvDebug", "optAutoScroll"].forEach(
                (id) =>
                    $(id).addEventListener("change", readSettingsFromUi),
            );
            $("optPollMs").addEventListener("change", readSettingsFromUi);
            // error 는 끄지 못함 — 클릭해도 다시 체크
            $("optLvError").addEventListener("click", (ev) => {
                ev.preventDefault();
                $("optLvError").checked = true;
            });

            $("fDate").addEventListener("change", onDateChange);
            $("fDateList").addEventListener("change", () => {
                if ($("fDateList").value) {
                    $("fDate").value = $("fDateList").value;
                    onDateChange();
                }
            });
            $("btnDayPrev").addEventListener("click", () => {
                $("fDate").value = shiftDay(selectedDate(), -1);
                onDateChange();
            });
            $("btnDayNext").addEventListener("click", () => {
                const n = shiftDay(selectedDate(), 1);
                if (n > todayKey) return;
                $("fDate").value = n;
                onDateChange();
            });
            $("btnToday").addEventListener("click", () => {
                $("fDate").value = todayKey;
                onDateChange();
            });
            $("btnFilterClear").addEventListener("click", () => {
                $("fText").value = "";
                applyRender();
            });

            $("btnDlAll").addEventListener("click", () => downloadLog("all"));
            $("btnDlErr").addEventListener("click", () => downloadLog("err"));

            $("btnTestError").addEventListener("click", async () => {
                try {
                    const r = await fetch("/api/logs/test-error", {
                        method: "POST",
                    });
                    const d = await r.json().catch(() => ({}));
                    $("updated").textContent =
                        `강제 오류: ${d.model ?? "?"} [${d.scenario ?? "?"}] HTTP ${d.status ?? r.status}`;
                } catch (e) {
                    $("updated").textContent = "요청 실패: " + e.message;
                }
                if (
                    isLiveDay() &&
                    (selected === "express" || selected === "all")
                ) {
                    refresh();
                }
            });

            $("btnClear").addEventListener("click", () => {
                const times = lastAll
                    .map((e) => new Date(e.ts || 0).getTime())
                    .filter((t) => Number.isFinite(t) && t > 0);
                hideBeforeTs = times.length
                    ? Math.max(...times)
                    : hideBeforeTs;
                applyRender();
            });

            $("fDate").value = todayKey;
            applySettingsToUi();
            loadDates()
                .then(() => loadSources())
                .then(() => selectSource(selected));
            restartPoll();
            setInterval(loadSources, 10000);
            setInterval(loadDates, 60000);
        </script>
        <script src="/nav.js"></script>
    </body>
</html>
