<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>neutda-ai · 모델 관리</title>
        <link rel="stylesheet" href="/dashboard.css" />
        <style>
            .summary.mini {
                grid-template-columns: repeat(4, 1fr);
            }
            @media (max-width: 760px) {
                .summary.mini {
                    grid-template-columns: repeat(2, 1fr);
                }
            }
            table {
                min-width: 980px;
            }
            .fixed-cell {
                position: relative;
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                gap: 5px;
                white-space: normal;
                min-width: 120px;
            }
            .fixed-btn {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                max-width: 160px;
                width: 100%;
                justify-content: space-between;
                background: #0d0f15;
                border: 1px solid var(--border);
                border-radius: 8px;
                color: var(--text);
                padding: 5px 10px;
                font-size: 11px;
                font-weight: 600;
                cursor: pointer;
                font-family: inherit;
            }
            .fixed-chips {
                display: flex;
                flex-wrap: wrap;
                gap: 4px;
            }
            .fixed-chips .chip {
                font-size: 10px;
                padding: 2px 7px;
                border-radius: 999px;
                background: rgba(108, 140, 255, 0.12);
                color: var(--accent);
                max-width: 120px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .fixed-chips .chip.sec {
                background: rgba(86, 200, 160, 0.14);
                color: #6dceb0;
            }
            .fixed-btn:hover,
            .fixed-btn[aria-expanded="true"] {
                border-color: var(--accent);
                color: var(--accent);
            }
            .fixed-btn .caret {
                margin-left: auto;
                color: var(--muted);
                font-size: 10px;
            }
            .fixed-btn[aria-expanded="true"] .caret {
                transform: rotate(180deg);
            }
            .fixed-btn .lab {
                overflow: hidden;
                text-overflow: ellipsis;
            }
            /* 테이블 overflow에 잘리지 않도록 body 포털 + fixed */
            #fixedPopPortal[hidden] {
                display: none !important;
            }
            .fixed-pop {
                position: fixed;
                z-index: 300;
                width: 260px;
                max-width: min(320px, calc(100vw - 24px));
                max-height: min(520px, calc(100vh - 16px));
                overflow-y: auto;
                box-sizing: border-box;
                background: #12151d;
                border: 1px solid var(--border);
                border-radius: 10px;
                box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
                padding: 8px;
                pointer-events: auto;
            }
            .fixed-pop.has-policy {
                width: 320px;
            }
            .fp-policy {
                margin-top: 8px;
                padding: 10px;
                border-top: 1px solid var(--border);
            }
            .fp-policy .fp-name {
                margin-bottom: 6px;
            }
            .fp-policy .sec-policy-ta {
                width: 100%;
                box-sizing: border-box;
                min-height: 96px;
                resize: vertical;
                background: #0d0f15;
                border: 1px solid var(--border);
                border-radius: 8px;
                color: var(--text);
                font-family: inherit;
                font-size: 11px;
                line-height: 1.45;
                padding: 8px;
            }
            .fp-policy .sec-policy-ta:focus {
                outline: none;
                border-color: var(--accent);
            }
            .fp-policy .fp-policy-actions {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
                margin-top: 8px;
            }
            .fp-policy .sec-policy-save {
                background: rgba(108, 140, 255, 0.15);
                border: 1px solid var(--accent);
                color: var(--accent);
                border-radius: 7px;
                padding: 5px 12px;
                font-size: 11px;
                font-weight: 600;
                cursor: pointer;
                font-family: inherit;
            }
            .fp-policy .sec-policy-save:hover {
                background: rgba(108, 140, 255, 0.28);
            }
            .fp-policy .sec-policy-save:disabled {
                opacity: 0.5;
                cursor: wait;
            }
            .fp-policy .fp-hint {
                font-size: 10px;
                color: var(--muted);
            }
            .fixed-pop .fp-item {
                display: flex;
                align-items: flex-start;
                gap: 10px;
                padding: 8px;
                border-radius: 8px;
            }
            .fixed-pop .fp-item:hover {
                background: rgba(108, 140, 255, 0.08);
            }
            .fixed-pop .fp-text {
                flex: 1;
                min-width: 0;
                overflow: hidden;
            }
            .fixed-pop .fp-name {
                font-size: 12px;
                font-weight: 700;
            }
            .fixed-pop .fp-hint {
                font-size: 10px;
                color: var(--muted);
                margin-top: 2px;
                line-height: 1.4;
                white-space: normal;
                overflow-wrap: anywhere;
                word-break: keep-all;
            }
            tr.server-row.open-skills td {
                background: rgba(108, 140, 255, 0.06);
            }
            .skills-summary {
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                gap: 5px;
                white-space: normal;
                min-width: 120px;
            }
            .skills-toggle {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                background: #0d0f15;
                border: 1px solid var(--border);
                border-radius: 8px;
                color: var(--text);
                padding: 6px 12px;
                font-size: 12px;
                font-weight: 600;
                cursor: pointer;
                font-family: inherit;
                width: 100%;
                justify-content: space-between;
            }
            .skills-toggle:hover {
                border-color: var(--accent);
                color: var(--accent);
            }
            .skills-toggle[aria-expanded="true"] {
                border-color: var(--accent);
                background: rgba(108, 140, 255, 0.1);
                color: var(--accent);
            }
            .skills-toggle .caret {
                color: var(--muted);
                font-size: 11px;
                transition: transform 0.15s ease;
            }
            .skills-toggle[aria-expanded="true"] .caret {
                transform: rotate(180deg);
            }
            .skills-chips {
                display: flex;
                flex-wrap: wrap;
                gap: 4px;
            }
            .skills-chips .chip {
                font-size: 10px;
                padding: 2px 7px;
                border-radius: 999px;
                background: rgba(108, 140, 255, 0.12);
                color: var(--accent);
                max-width: 150px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            /* 행 아래 전체 너비 아코디언 */
            tr.skills-acc-row > td {
                padding: 0;
                border-bottom: 1px solid var(--border);
                background: #12151e;
                white-space: normal;
            }
            .skills-acc {
                padding: 14px 16px 16px;
                border-top: 1px solid rgba(108, 140, 255, 0.2);
            }
            .skills-acc-head {
                display: flex;
                flex-wrap: wrap;
                align-items: baseline;
                justify-content: space-between;
                gap: 8px;
                margin-bottom: 12px;
            }
            .skills-acc-head .title {
                font-size: 13px;
                font-weight: 700;
            }
            .skills-acc-head .sub {
                font-size: 12px;
                color: var(--muted);
            }
            .skill-rows {
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            .skill-row {
                display: flex;
                gap: 8px;
                align-items: flex-start;
                background: #0d0f15;
                border: 1px solid var(--border);
                border-radius: 8px;
                padding: 8px;
            }
            .skill-row .idx {
                flex: 0 0 auto;
                width: 22px;
                height: 22px;
                border-radius: 50%;
                background: rgba(108, 140, 255, 0.15);
                color: var(--accent);
                font-size: 11px;
                font-weight: 700;
                display: flex;
                align-items: center;
                justify-content: center;
                margin-top: 4px;
            }
            .skill-ta {
                flex: 1;
                min-height: 56px;
                resize: vertical;
                background: transparent;
                border: 0;
                color: var(--text);
                padding: 4px 2px;
                font-size: 13px;
                font-family: inherit;
                line-height: 1.45;
            }
            .skill-ta:focus {
                outline: none;
            }
            .skill-ta::placeholder {
                color: #4d5464;
            }
            .skill-rm {
                background: rgba(248, 81, 73, 0.12);
                color: #ff9c95;
                border: 0;
                border-radius: 6px;
                padding: 6px 10px;
                font-size: 11px;
                font-weight: 700;
                cursor: pointer;
                margin-top: 2px;
            }
            .skill-rm:hover {
                background: rgba(248, 81, 73, 0.26);
                color: #fff;
            }
            .skill-actions {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                margin-top: 12px;
            }
            .skill-add,
            .skill-save,
            .skill-close {
                background: transparent;
                border: 1px solid var(--border);
                border-radius: 7px;
                color: var(--text);
                padding: 7px 14px;
                font-size: 12px;
                font-weight: 700;
                cursor: pointer;
                font-family: inherit;
            }
            .skill-add:hover,
            .skill-close:hover {
                border-color: var(--accent);
                color: var(--accent);
            }
            .skill-save.primary {
                background: var(--accent);
                border-color: var(--accent);
                color: #fff;
            }
            .skill-save.primary:hover {
                background: #5570e6;
            }
            .skill-save:disabled,
            .skill-add:disabled {
                opacity: 0.55;
                cursor: wait;
            }
            /* 추가 폼 역할 아코디언 */
            .as-skills {
                width: 100%;
                margin-top: 12px;
                border: 1px solid var(--border);
                border-radius: 10px;
                overflow: hidden;
                background: #0d0f15;
            }
            .as-skills-toggle {
                width: 100%;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
                background: transparent;
                border: 0;
                color: var(--text);
                padding: 11px 14px;
                font-size: 12px;
                font-weight: 700;
                cursor: pointer;
                font-family: inherit;
                text-align: left;
            }
            .as-skills-toggle:hover {
                color: var(--accent);
            }
            .as-skills-toggle .caret {
                color: var(--muted);
                transition: transform 0.15s ease;
            }
            .as-skills.open .as-skills-toggle .caret {
                transform: rotate(180deg);
            }
            .as-skills-body {
                display: none;
                padding: 0 14px 14px;
                border-top: 1px solid var(--border);
            }
            .as-skills.open .as-skills-body {
                display: block;
                padding-top: 12px;
            }
            .common-list {
                display: flex;
                flex-direction: column;
                gap: 6px;
            }
            .common-item {
                display: flex;
                align-items: flex-start;
                gap: 8px;
                padding: 8px 10px;
                border: 1px solid var(--border);
                border-radius: 8px;
                background: #0d0f15;
                font-size: 12px;
            }
            .common-item label {
                display: flex;
                gap: 8px;
                align-items: flex-start;
                cursor: pointer;
                flex: 1;
            }
            .common-item .cname {
                font-weight: 700;
            }
            .common-item .cdesc {
                color: var(--muted);
                font-weight: 400;
                margin-top: 2px;
            }
            .acc-section-title {
                font-size: 12px;
                font-weight: 700;
                color: var(--muted);
                margin: 4px 0 8px;
                text-transform: uppercase;
                letter-spacing: 0.04em;
            }
            .acc-section-title:not(:first-child) {
                margin-top: 16px;
            }
            .role-filter {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 8px;
                margin: 0 0 14px;
            }
            .role-filter .rf-label {
                font-size: 11px;
                font-weight: 700;
                color: var(--muted);
                margin-right: 2px;
            }
            .rf-chip {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                border: 1px solid var(--border);
                background: #0d0f15;
                color: var(--muted);
                border-radius: 999px;
                padding: 5px 12px;
                font-size: 12px;
                font-weight: 600;
                cursor: pointer;
                font-family: inherit;
            }
            .rf-chip:hover {
                border-color: var(--accent);
                color: var(--text);
            }
            .rf-chip.active {
                background: rgba(108, 140, 255, 0.16);
                border-color: var(--accent);
                color: var(--accent);
            }
            .rf-chip .n {
                font-variant-numeric: tabular-nums;
                font-size: 11px;
                opacity: 0.85;
            }
        </style>
    </head>
    <body>
        <div class="wrap">
            <header>
                <h1>
                    모델 관리
                    <span id="routeBadge" class="route-badge">–</span>
                </h1>
                <div><span id="updated" class="updated"></span></div>
            </header>

            <div class="summary mini">
                <div class="card">
                    <div class="k">등록 서버</div>
                    <div class="v" id="sDefined">–</div>
                </div>
                <div class="card">
                    <div class="k">실행 중</div>
                    <div class="v" id="sRunning">–</div>
                </div>
                <div class="card">
                    <div class="k">정상(헬스 OK)</div>
                    <div class="v" id="sHealthy" style="color: var(--ok)">–</div>
                </div>
                <div class="card">
                    <div class="k">라우터 활성</div>
                    <div class="v" id="sRouters" style="color: var(--accent)">
                        –
                    </div>
                </div>
            </div>

            <div class="role-filter" id="roleFilter" aria-label="고정 기능 필터">
                <span class="rf-label">필터</span>
            </div>

            <p class="muted" style="margin: -6px 0 16px">
                역할 칸을 열면
                <a href="/roles.html">역할 관리</a>에서 만든 공통 역할을
                체크하고, 이 모델만의 커스텀 역할도 추가할 수 있습니다. 둘 다
                비우면 일반 풀에서 자동 분배됩니다.
            </p>

            <div class="card add-server">
                <div class="k" style="margin-bottom: 9px">
                    모델 서버 추가
                    <span class="muted" style="font-weight: 400">
                        — 티어 선택 후 modelconfig.json 등록 모델에서 고릅니다.
                        모델이 하나면 자동 선택. 이름·포트는 자동 할당.</span
                    >
                </div>
                <div class="as-row">
                    <label>
                        티어
                        <select id="asTier">
                            <option value="small">small</option>
                            <option value="medium">medium</option>
                            <option value="large">large</option>
                        </select>
                    </label>
                    <label class="grow">
                        모델
                        <select id="asModel"></select>
                    </label>
                    <label>
                        별칭
                        <input
                            id="asAlias"
                            type="text"
                            style="width: 160px"
                            placeholder="표시 이름 (선택)"
                        />
                    </label>
                    <label>
                        컨텍스트(ctx)
                        <input id="asCtx" type="number" style="width: 90px" />
                    </label>
                    <label title="0 = CPU 전용, 99 = 전체 레이어 GPU">
                        GPU 레이어(ngl)
                        <input id="asNgl" type="number" style="width: 90px" />
                    </label>
                    <label title="CUDA_VISIBLE_DEVICES 값. 비우면 기본 GPU">
                        GPU ID
                        <input
                            id="asGpu"
                            type="text"
                            style="width: 70px"
                            placeholder="(기본)"
                        />
                    </label>
                    <button id="asAdd" class="as-add-btn">추가 + 기동</button>
                </div>
                <div
                    id="asModelHint"
                    class="muted"
                    style="margin-top: 8px; font-size: 11px"
                ></div>
                <div class="as-skills" id="asSkillsAcc">
                    <button
                        type="button"
                        class="as-skills-toggle"
                        id="asSkillsToggle"
                        aria-expanded="false"
                    >
                        <span
                            >역할 (선택)
                            <span class="muted" style="font-weight: 400"
                                >— 공통 체크 + 커스텀 추가</span
                            ></span
                        >
                        <span class="caret">▾</span>
                    </button>
                    <div class="as-skills-body">
                        <div class="k" style="margin-bottom: 8px">공통 역할</div>
                        <div id="asCommonList" class="common-list"></div>
                        <div class="k" style="margin: 12px 0 8px">
                            커스텀 역할
                        </div>
                        <div id="asSkillList" class="skill-rows"></div>
                        <div class="skill-actions">
                            <button
                                type="button"
                                id="asSkillAdd"
                                class="skill-add"
                            >
                                + 커스텀 역할 추가
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="table-scroll" id="tableScroll">
                <table>
                    <thead>
                        <tr>
                            <th>백엔드</th>
                            <th>별칭</th>
                            <th>역할</th>
                            <th>티어</th>
                            <th>장치</th>
                            <th>모델</th>
                            <th>상태</th>
                            <th>기능</th>
                            <th>전원</th>
                        </tr>
                    </thead>
                    <tbody id="rows">
                        <tr>
                            <td colspan="9" class="muted">불러오는 중…</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <p class="muted" id="hint" style="margin-top: 14px"></p>
        </div>
        <div id="fixedPopPortal" hidden></div>

        <script>
            const $ = (id) => document.getElementById(id);
            const COLS = 9;
            const SKILL_MAX = 8;
            let roleBusy = false;
            let powerBusy = false;
            let serversCache = [];
            let catalogRoles = []; // 역할 관리에서 만든 공통 역할
            let addFormInit = false;
            let modelConfig = null;
            /** 역할 아코디언이 열린 서버 name (한 번에 하나만) */
            let openSkillName = null;
            let roleDraft = null; // { roleIds, customTexts } | null
            let skillSaveBusy = false;

            function escAttr(s) {
                return String(s ?? "")
                    .replace(/&/g, "&amp;")
                    .replace(/"/g, "&quot;");
            }
            function esc(s) {
                return String(s ?? "")
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;");
            }

            function commonCount(sv) {
                return (sv?.roleIds || []).length;
            }
            function customOf(sv) {
                if (Array.isArray(sv?.customSkills)) return sv.customSkills;
                // 구호환: roleIds 없이 skills 만 있으면 전부 커스텀으로 취급
                if (!sv?.roleIds?.length && Array.isArray(sv?.skills))
                    return sv.skills;
                if (sv?.skill && !sv?.roleIds?.length) return [sv.skill];
                return [];
            }
            function customCount(sv) {
                return customOf(sv).length;
            }

            function skillRowHtml(value, idx) {
                return `<div class="skill-row">
        <span class="idx">${idx}</span>
        <textarea class="skill-ta" rows="2" placeholder="예: 이 모델만의 커스텀 역할">${esc(value || "")}</textarea>
        <button type="button" class="skill-rm" title="이 역할 제거">삭제</button>
      </div>`;
            }

            function renumberSkillRows(root) {
                [...root.querySelectorAll(".skill-row")].forEach((row, i) => {
                    const idx = row.querySelector(".idx");
                    if (idx) idx.textContent = String(i + 1);
                });
            }

            function collectCustomValues(root) {
                return [...root.querySelectorAll(".skill-ta")]
                    .map((ta) => ta.value.replace(/\s+/g, " ").trim())
                    .filter(Boolean)
                    .slice(0, SKILL_MAX);
            }

            function collectCommonIds(root) {
                return [...root.querySelectorAll(".common-cb:checked")].map(
                    (cb) => cb.value,
                );
            }

            function captureOpenSkillDraft() {
                if (!openSkillName) {
                    roleDraft = null;
                    return;
                }
                const panel = document.querySelector(
                    `.skills-acc[data-name="${CSS.escape(openSkillName)}"]`,
                );
                if (!panel) return;
                roleDraft = {
                    roleIds: collectCommonIds(panel),
                    customTexts: [...panel.querySelectorAll(".skill-ta")].map(
                        (ta) => ta.value,
                    ),
                };
            }

            function commonListHtml(selectedIds) {
                const sel = new Set(selectedIds || []);
                if (!catalogRoles.length) {
                    return `<div class="muted" style="font-size:12px">공통 역할이 없습니다. <a href="/roles.html">역할 관리</a>에서 먼저 만드세요.</div>`;
                }
                return catalogRoles
                    .map(
                        (r) => `<div class="common-item">
          <label>
            <input type="checkbox" class="common-cb" value="${escAttr(r.id)}" ${sel.has(r.id) ? "checked" : ""}>
            <span>
              <div class="cname">${esc(r.name)}</div>
              <div class="cdesc">${esc(r.description || "")}</div>
            </span>
          </label>
        </div>`,
                    )
                    .join("");
            }

            function renderSkillsSummary(sv, b) {
                if (!sv) {
                    const n = (b?.skills || []).length;
                    return n
                        ? `<span class="muted">역할 ${n}개</span>`
                        : '<span class="muted">–</span>';
                }
                const open = openSkillName === sv.name;
                const c = commonCount(sv);
                const u = customCount(sv);
                const label = `공통역할 ${c}개, 커스텀 역할 ${u}개`;
                const chips =
                    !open && (c || u)
                        ? `<div class="skills-chips">${[
                              ...(sv.commonSkills || []).slice(0, 2),
                              ...customOf(sv).slice(0, 2),
                          ]
                              .map(
                                  (s) =>
                                      `<span class="chip" title="${escAttr(s)}">${esc(s)}</span>`,
                              )
                              .join("")}</div>`
                        : "";
                return `<div class="skills-summary">
      <button type="button" class="skills-toggle" data-name="${escAttr(sv.name)}" aria-expanded="${open}">
        <span>${label}</span><span class="caret">▾</span>
      </button>
      ${chips}
    </div>`;
            }

            function renderSkillsAccordion(sv) {
                const draft =
                    openSkillName === sv.name && roleDraft ? roleDraft : null;
                const roleIds = draft?.roleIds ?? sv.roleIds ?? [];
                const customs = draft?.customTexts ?? customOf(sv);
                const rows = (customs.length ? customs : [""])
                    .map((s, i) => skillRowHtml(s, i + 1))
                    .join("");
                const alias = sv.alias || sv.name;
                return `<tr class="skills-acc-row" data-name="${escAttr(sv.name)}">
      <td colspan="${COLS}">
        <div class="skills-acc" data-name="${escAttr(sv.name)}">
          <div class="skills-acc-head">
            <div>
              <div class="title">${esc(alias)} · 역할 설정</div>
              <div class="sub">공통 역할을 체크하고, 필요하면 이 모델만의 커스텀 역할을 추가하세요.</div>
            </div>
          </div>
          <div class="acc-section-title">공통 역할</div>
          <div class="common-list">${commonListHtml(roleIds)}</div>
          <div class="acc-section-title">커스텀 역할</div>
          <div class="skill-rows">${rows}</div>
          <div class="skill-actions">
            <button type="button" class="skill-add" data-name="${escAttr(sv.name)}">+ 커스텀 역할 추가</button>
            <button type="button" class="skill-save primary" data-name="${escAttr(sv.name)}">저장</button>
            <button type="button" class="skill-close" data-name="${escAttr(sv.name)}">닫기</button>
          </div>
        </div>
      </td>
    </tr>`;
            }

            const FIXED_ROLE_KEYS = [
                "solve",
                "router",
                "planner",
                "embedding",
                "security",
            ];
            const FIXED_ROLE_META = {
                solve: {
                    label: "해결",
                    hint: "질문 답변 풀에 포함. 전용 기능이 켜지면 자동 제외",
                },
                router: {
                    label: "라우터",
                    hint: "티어·난이도 분류 (요청마다)",
                },
                planner: {
                    label: "파이프라인 설계",
                    hint: "workflow 단계 구성 · 라우터와 분리",
                },
                embedding: {
                    label: "임베딩",
                    hint: "RAG 의미검색 (/v1/embeddings)",
                },
                security: {
                    label: "보안검증",
                    hint: "최종 답변 직전 검사 · 정책은 보안 관리에서 배정",
                },
            };
            /** 고정 기능 드롭다운이 열린 백엔드 url */
            let openFixedUrl = null;
            /** 상단 필터: all | solve | router | planner | embedding | security */
            let roleFilter = "all";
            let backendsCache = [];

            function renderRoleFilter(backends) {
                const box = $("roleFilter");
                if (!box) return;
                const counts = { all: backends.length };
                for (const k of FIXED_ROLE_KEYS) {
                    counts[k] = backends.filter((b) => fixedEnabled(b, k)).length;
                }
                const chips = [
                    { key: "all", label: "전체" },
                    ...FIXED_ROLE_KEYS.map((k) => ({
                        key: k,
                        label: FIXED_ROLE_META[k].label,
                    })),
                ];
                box.innerHTML =
                    `<span class="rf-label">필터</span>` +
                    chips
                        .map(
                            (c) => `<button type="button" class="rf-chip ${roleFilter === c.key ? "active" : ""}" data-filter="${c.key}">
          ${esc(c.label)}<span class="n">${counts[c.key] ?? 0}</span>
        </button>`,
                        )
                        .join("");
            }

            function fixedEnabled(b, role) {
                const r = b.roles || {};
                if (role === "solve")
                    return r.solve ?? r.chat ?? b.solveEnabled ?? b.chatEnabled ?? false;
                if (role === "router") return r.router ?? b.routerEnabled ?? false;
                if (role === "planner")
                    return r.planner ?? b.plannerEnabled ?? false;
                if (role === "embedding")
                    return r.embedding ?? b.embeddingEnabled ?? false;
                if (role === "security")
                    return r.security ?? b.securityEnabled ?? false;
                return false;
            }

            function securityIdsOf(b) {
                if (Array.isArray(b.securityIds)) return b.securityIds;
                const sv = serversCache.find((x) => x.url === b.url);
                return Array.isArray(sv?.securityIds) ? sv.securityIds : [];
            }

            function fixedPopItemsHtml(b) {
                const items = FIXED_ROLE_KEYS.map((role) => {
                    const meta = FIXED_ROLE_META[role];
                    const checked = fixedEnabled(b, role);
                    return `<div class="fp-item">
        <label class="role-switch" title="${escAttr(meta.hint)}">
          <input type="checkbox" class="role-toggle" data-url="${escAttr(b.url)}" data-role="${role}" ${checked ? "checked" : ""} ${roleBusy ? "disabled" : ""}>
          <span class="role-slider"></span>
        </label>
        <div class="fp-text">
          <div class="fp-name">${esc(meta.label)}</div>
          <div class="fp-hint">${esc(meta.hint)}</div>
        </div>
      </div>`;
                }).join("");
                const secOn = fixedEnabled(b, "security");
                const n = securityIdsOf(b).length;
                const policyBlock = secOn
                    ? `<div class="fp-policy">
        <div class="fp-name">보안 정책 ${n}개 배정</div>
        <div class="fp-hint">정책 작성·배정은 <a href="/security.html" style="color:var(--accent)">보안 관리</a>에서 합니다. 최종 답변 직전에 이 모델이 배정 정책으로 검사합니다.</div>
      </div>`
                    : `<div class="fp-policy"><div class="fp-hint">보안검증을 켜면 보안 관리에서 정책을 입힐 수 있습니다.</div></div>`;
                return items + policyBlock;
            }

            function securityPolicyNamesOf(b) {
                const sv = serversCache.find((x) => x.url === b.url);
                const list = sv?.securityPolicies || b.securityPolicies || [];
                if (Array.isArray(list) && list.length) {
                    return list
                        .map((p) => (typeof p === "string" ? p : p?.name))
                        .filter(Boolean);
                }
                return [];
            }

            function renderFixedCell(b) {
                const on = FIXED_ROLE_KEYS.filter((k) => fixedEnabled(b, k));
                const open = openFixedUrl === b.url;
                const lab = on.length
                    ? `기능 ${on.length}개`
                    : "기능 없음";
                const roleChips = on.map(
                    (k) =>
                        `<span class="chip" title="${escAttr(FIXED_ROLE_META[k].hint)}">${esc(FIXED_ROLE_META[k].label)}</span>`,
                );
                const secNames = fixedEnabled(b, "security")
                    ? securityPolicyNamesOf(b)
                    : [];
                const secChips = secNames.map(
                    (n) =>
                        `<span class="chip sec" title="보안 정책">${esc(n)}</span>`,
                );
                const chips =
                    !open && (roleChips.length || secChips.length)
                        ? `<div class="fixed-chips">${[...roleChips, ...secChips].join("")}</div>`
                        : "";
                return `<div class="fixed-cell">
      <button type="button" class="fixed-btn" data-url="${escAttr(b.url)}" aria-expanded="${open}" title="${escAttr(on.map((k) => FIXED_ROLE_META[k].label).join(" · ") || "없음")}">
        <span class="lab">${esc(lab)}</span><span class="caret">▾</span>
      </button>
      ${chips}
    </div>`;
            }

            function findFixedBtn(url) {
                return [
                    ...document.querySelectorAll(".fixed-btn"),
                ].find((el) => el.dataset.url === url);
            }

            function syncFixedPop() {
                const portal = $("fixedPopPortal");
                if (!portal) return;
                if (!openFixedUrl) {
                    portal.innerHTML = "";
                    portal.hidden = true;
                    return;
                }
                const b = backendsCache.find((x) => x.url === openFixedUrl);
                const btn = findFixedBtn(openFixedUrl);
                if (!b || !btn) {
                    openFixedUrl = null;
                    portal.innerHTML = "";
                    portal.hidden = true;
                    return;
                }
                portal.hidden = false;
                const secOn = fixedEnabled(b, "security");
                portal.innerHTML = `<div class="fixed-pop${secOn ? " has-policy" : ""}" role="dialog" aria-label="기능 설정">${fixedPopItemsHtml(b)}</div>`;
                const pop = portal.querySelector(".fixed-pop");
                const rect = btn.getBoundingClientRect();
                const popW = Math.min(secOn ? 320 : 260, window.innerWidth - 16);
                let left = rect.right - popW;
                left = Math.max(8, Math.min(left, window.innerWidth - popW - 8));
                let top = rect.bottom + 4;
                const ph = pop.offsetHeight;
                if (
                    top + ph > window.innerHeight - 8 &&
                    rect.top - 4 - ph >= 8
                ) {
                    top = rect.top - 4 - ph;
                } else {
                    top = Math.max(
                        8,
                        Math.min(top, window.innerHeight - ph - 8),
                    );
                }
                pop.style.left = `${left}px`;
                pop.style.top = `${top}px`;
            }

            function closeFixedPop() {
                if (!openFixedUrl) return;
                openFixedUrl = null;
                syncFixedPop();
                document
                    .querySelectorAll('.fixed-btn[aria-expanded="true"]')
                    .forEach((el) => el.setAttribute("aria-expanded", "false"));
            }

            async function refresh() {
                if (powerBusy || skillSaveBusy || roleBusy) return; // 전원·역할 저장 중엔 재렌더 보류
                // 별칭·역할 편집 중엔 커서가 날아가지 않도록 보류
                if (
                    document.activeElement?.matches?.(
                        ".alias-edit, .skill-ta, .common-cb, .role-toggle",
                    ) ||
                    document.activeElement?.closest?.(".fixed-pop")
                ) {
                    return;
                }
                try {
                    captureOpenSkillDraft();
                    const [r, rs, rr] = await Promise.all([
                        fetch("/api/status"),
                        fetch("/api/servers").catch(() => null),
                        fetch("/api/roles").catch(() => null),
                    ]);
                    const s = await r.json();
                    let servers = [];
                    try {
                        servers = (await rs?.json())?.servers ?? [];
                    } catch {}
                    try {
                        catalogRoles = (await rr?.json())?.roles ?? catalogRoles;
                    } catch {}
                    const svByUrl = new Map(servers.map((x) => [x.url, x]));
                    serversCache = servers;
                    if (!addFormInit) {
                        addFormInit = true;
                        initAddForm();
                    }

                    $("sDefined").textContent = servers.length || "–";
                    $("sRunning").textContent = servers.filter(
                        (x) => x.running,
                    ).length;
                    $("sHealthy").textContent = s.healthyBackends;
                    $("sRouters").textContent = s.backends.filter(
                        (b) => b.roles?.router ?? b.routerEnabled ?? false,
                    ).length;

                    const eff = s.routing?.effectiveMode ?? "heuristic";
                    const badge = $("routeBadge");
                    badge.textContent =
                        eff === "llm"
                            ? "티어 판정: LLM 라우터"
                            : "티어 판정: 글자수 휴리스틱";
                    badge.className =
                        "route-badge" + (eff === "llm" ? "" : " heuristic");

                    const tierRank = { large: 0, medium: 1, small: 2 };
                    const backends = [...s.backends].sort((a, b) => {
                        const ta = tierRank[a.tier] ?? 9;
                        const tb = tierRank[b.tier] ?? 9;
                        if (ta !== tb) return ta - tb;
                        const ga = a.device === "gpu" ? 0 : 1;
                        const gb = b.device === "gpu" ? 0 : 1;
                        if (ga !== gb) return ga - gb;
                        return String(a.url).localeCompare(String(b.url));
                    });
                    backendsCache = backends;
                    renderRoleFilter(backends);
                    const shown =
                        roleFilter === "all"
                            ? backends
                            : backends.filter((b) =>
                                  fixedEnabled(b, roleFilter),
                              );
                    $("rows").innerHTML = shown.length
                        ? shown
                        .map((b) => {
                            const rolesHtml = renderFixedCell(b);
                            const sv = svByUrl.get(b.url);
                            let power = '<span class="muted">–</span>';
                            if (sv) {
                                const state =
                                    sv.running && !b.healthy
                                        ? '<span class="pw-loading">로딩중…</span>'
                                        : `<span class="pw-state">${sv.running ? "ON" : "OFF"}</span>`;
                                const fail =
                                    !sv.running && sv.startError
                                        ? `<span class="start-err" title="${escAttr(sv.startError)}">${escAttr(sv.startError)}</span>`
                                        : "";
                                power = `<span class="role-pair" title="모델 서버 프로세스 기동/종료 (OFF 시 VRAM/메모리 해제)">
      <label class="role-switch">
        <input type="checkbox" class="pw-toggle" data-name="${escAttr(sv.name)}" ${sv.running ? "checked" : ""} ${powerBusy ? "disabled" : ""}>
        <span class="role-slider"></span>
      </label>${state}<button class="del-btn" data-name="${escAttr(sv.name)}" title="서버 정의 삭제 (실행 중이면 종료 후 servers.json 에서 제거)">삭제</button>
      ${fail}
    </span>`;
                            }
                            const open =
                                sv && openSkillName === sv.name
                                    ? " open-skills"
                                    : "";
                            const main = `
          <tr class="server-row${open}" data-name="${escAttr(sv?.name || "")}">
            <td>${b.url}</td>
            <td>${
                sv
                    ? `<input class="alias-edit" data-name="${escAttr(sv.name)}" value="${escAttr(sv.alias || sv.name)}" title="Enter 또는 포커스 아웃 시 저장">
                       <span class="alias-name">${escAttr(sv.name)}</span>`
                    : escAttr(b.alias || "–")
            }</td>
            <td>${renderSkillsSummary(sv, b)}</td>
            <td><span class="tier tier-${b.tier}">${b.tier ?? "–"}</span></td>
            <td><span class="dev dev-${b.device || "na"}">${b.device ? b.device.toUpperCase() : "–"}</span></td>
            <td class="model" title="${b.model ?? ""}">${b.model ? b.model.split(/[\\/]/).pop() : '<span class="muted">–</span>'}</td>
            <td><span class="pill ${b.healthy ? "up" : "down"}"><span class="dot"></span>${b.healthy ? "정상" : "다운"}</span></td>
            <td>${rolesHtml}</td>
            <td>${power}</td>
          </tr>`;
                            const acc =
                                sv && openSkillName === sv.name
                                    ? renderSkillsAccordion(sv)
                                    : "";
                            return main + acc;
                        })
                        .join("")
                        : `<tr><td colspan="${COLS}" class="muted">이 필터에 해당하는 모델이 없습니다.</td></tr>`;

                    $("hint").textContent =
                        s.healthyBackends === 0
                            ? "정상 백엔드가 없습니다. 위에서 모델 서버를 추가하거나 전원을 켜세요 (npm run llama / run-llama-cluster.ps1)."
                            : eff === "heuristic"
                              ? "라우터 역할이 모두 꺼져 있어 글자수·키워드 휴리스틱으로 티어를 판정합니다. 원하는 모델의 라우터 토글을 켜세요."
                              : "";
                    $("updated").textContent =
                        "갱신 " + new Date().toLocaleTimeString();
                    syncFixedPop();
                } catch (e) {
                    $("rows").innerHTML =
                        `<tr><td colspan="${COLS}" class="err">상태 조회 실패: ${e.message}</td></tr>`;
                    closeFixedPop();
                }
            }

            // ===== 모델 서버 추가/삭제 =====
            async function initAddForm() {
                try {
                    const r = await fetch("/api/modelconfig");
                    const d = await r.json();
                    if (!r.ok) throw new Error(d.error || "modelconfig 로드 실패");
                    modelConfig = d;
                } catch (e) {
                    console.warn(e);
                    modelConfig = { tiers: {} };
                    $("asModelHint").textContent =
                        "modelconfig.json 을 불러오지 못했습니다: " + e.message;
                }
                fillModelSelect();
                resetAddSkills();
            }

            function tierModels(tier) {
                return modelConfig?.tiers?.[tier]?.models ?? [];
            }

            function selectedModelEntry() {
                const sel = $("asModel");
                const id = sel.value;
                if (!id) return null;
                return tierModels($("asTier").value).find((m) => m.id === id) ?? null;
            }

            function applyModelDefaults(entry) {
                if (!entry) {
                    $("asCtx").value = 4096;
                    $("asNgl").value = 0;
                    $("asNgl").disabled = true;
                    $("asNgl").title = "";
                    $("asGpu").value = "";
                    $("asGpu").disabled = true;
                    $("asModelHint").textContent = "";
                    return;
                }
                $("asCtx").value = entry.ctx ?? 4096;
                const isCpu = !(Number(entry.ngl) > 0);
                $("asNgl").value = isCpu ? 0 : (entry.ngl ?? 99);
                // CPU 모델은 GPU 레이어/GPU ID 조정 불가
                $("asNgl").disabled = isCpu;
                $("asNgl").title = isCpu
                    ? "CPU 모델 — GPU 레이어를 사용할 수 없습니다"
                    : "0 = CPU, 1~레이어수 = 부분 오프로드, 99 = 전체 GPU";
                $("asGpu").value = isCpu ? "" : (entry.gpu ?? "");
                $("asGpu").disabled = isCpu;
                $("asGpu").title = isCpu
                    ? "CPU 모델 — GPU ID 불필요"
                    : "CUDA_VISIBLE_DEVICES 값. 비우면 기본 GPU";
                if (!$("asAlias").value.trim()) {
                    $("asAlias").placeholder = entry.label || "표시 이름 (선택)";
                }
                updateVramHint(entry);
            }

            function renderAddCommonList() {
                $("asCommonList").innerHTML = commonListHtml([]);
            }

            function resetAddSkills() {
                $("asSkillList").innerHTML = "";
                renderAddCommonList();
                $("asSkillsAcc")?.classList.remove("open");
                $("asSkillsToggle")?.setAttribute("aria-expanded", "false");
            }

            async function updateVramHint(entry) {
                if (!entry) {
                    $("asModelHint").textContent = "";
                    return;
                }
                const miss = entry.exists === false ? " ⚠ 파일 없음" : "";
                const mm = entry.mmproj ? ` · mmproj: ${entry.mmproj}` : "";
                const ngl = Number($("asNgl").value);
                const ctx = Number($("asCtx").value);
                let vram = "";
                try {
                    const r = await fetch("/api/servers/estimate-vram", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            model: entry.path,
                            mmproj: entry.mmproj,
                            ngl,
                            ctx,
                            layers: entry.layers,
                            gpu: $("asGpu").value.trim(),
                        }),
                    });
                    const d = await r.json();
                    if (r.ok) {
                        if (ngl <= 0) {
                            vram = " · CPU 전용 (VRAM 0)";
                        } else {
                            const gb = (d.requiredMb / 1024).toFixed(1);
                            const pct = d.detail?.fraction != null
                                ? Math.round(d.detail.fraction * 100)
                                : "?";
                            const free =
                                d.freeMb != null
                                    ? ` / 가용 ${(d.freeMb / 1024).toFixed(1)}GB`
                                    : "";
                            const warn =
                                d.freeMb != null && d.requiredMb > d.freeMb
                                    ? " ⚠ 부족 가능"
                                    : "";
                            vram = ` · 예상 VRAM ≈${gb}GB (ngl=${ngl}/${d.detail?.layers ?? "?"}, ≈${pct}%)${free}${warn}`;
                        }
                    }
                } catch {
                    if (ngl <= 0) vram = " · CPU 전용";
                }
                $("asModelHint").textContent = `${entry.path}${mm}${vram}${miss}`;
            }

            function fillModelSelect() {
                const tier = $("asTier").value;
                const models = tierModels(tier);
                const sel = $("asModel");
                sel.innerHTML = "";

                if (!models.length) {
                    const opt = document.createElement("option");
                    opt.value = "";
                    opt.textContent = `(${tier} 등록 모델 없음 — modelconfig.json 확인)`;
                    sel.appendChild(opt);
                    sel.disabled = true;
                    $("asAdd").disabled = true;
                    applyModelDefaults(null);
                    $("asAlias").placeholder = `${tier} 표시 이름 (선택)`;
                    return;
                }

                $("asAdd").disabled = false;
                for (const m of models) {
                    const opt = document.createElement("option");
                    opt.value = m.id;
                    opt.textContent =
                        m.label + (m.exists === false ? " (파일 없음)" : "");
                    sel.appendChild(opt);
                }

                // 하나면 바로 선택, 여러 개면 첫 항목 선택 + 선택 가능
                sel.disabled = models.length === 1;
                sel.selectedIndex = 0;
                applyModelDefaults(models[0]);
                $("asAlias").value = "";
                $("asAlias").placeholder = models[0].label || `${tier} 표시 이름`;
            }

            $("asTier").addEventListener("change", fillModelSelect);
            $("asModel").addEventListener("change", () => {
                const entry = selectedModelEntry();
                applyModelDefaults(entry);
                if (entry && !$("asAlias").dataset.touched) {
                    $("asAlias").placeholder = entry.label || "";
                }
            });
            $("asNgl").addEventListener("change", () =>
                updateVramHint(selectedModelEntry()),
            );
            $("asCtx").addEventListener("change", () =>
                updateVramHint(selectedModelEntry()),
            );
            $("asGpu").addEventListener("change", () =>
                updateVramHint(selectedModelEntry()),
            );
            $("asAlias").addEventListener("input", () => {
                $("asAlias").dataset.touched = "1";
            });

            $("asSkillsToggle").addEventListener("click", () => {
                const acc = $("asSkillsAcc");
                const open = acc.classList.toggle("open");
                $("asSkillsToggle").setAttribute("aria-expanded", String(open));
                if (open) renderAddCommonList();
            });
            $("asSkillAdd").addEventListener("click", () => {
                const box = $("asSkillList");
                if (box.querySelectorAll(".skill-row").length >= SKILL_MAX) {
                    alert(`커스텀 역할은 최대 ${SKILL_MAX}개까지 등록할 수 있습니다.`);
                    return;
                }
                const n = box.querySelectorAll(".skill-row").length + 1;
                box.insertAdjacentHTML("beforeend", skillRowHtml("", n));
                box.querySelector(".skill-row:last-child .skill-ta")?.focus();
            });
            $("asSkillList").addEventListener("click", (e) => {
                const rm = e.target.closest(".skill-rm");
                if (!rm) return;
                rm.closest(".skill-row")?.remove();
                renumberSkillRows($("asSkillList"));
            });

            $("asAdd").addEventListener("click", async () => {
                const btn = $("asAdd");
                const entry = selectedModelEntry();
                if (!entry) {
                    alert("모델을 선택하세요. (modelconfig.json 에 티어별 모델을 등록하세요)");
                    return;
                }
                btn.disabled = true;
                btn.textContent = "추가 중…";
                try {
                    const body = {
                        tier: $("asTier").value,
                        modelId: entry.id,
                        model: entry.path,
                        mmproj: entry.mmproj || undefined,
                        ctx: Number($("asCtx").value),
                        // CPU 카탈로그 항목이면 ngl 강제 0
                        ngl: Number(entry.ngl) > 0 ? Number($("asNgl").value) : 0,
                        gpu: Number(entry.ngl) > 0 ? $("asGpu").value.trim() : "",
                        alias: $("asAlias").value.trim() || entry.label,
                        roleIds: collectCommonIds($("asCommonList")),
                        skills: collectCustomValues($("asSkillList")),
                    };
                    const r = await fetch("/api/servers", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(body),
                    });
                    const d = await r.json().catch(() => ({}));
                    if (!r.ok) throw new Error(d.error || "추가 실패");
                    $("asAlias").value = "";
                    resetAddSkills();
                    delete $("asAlias").dataset.touched;
                } catch (e) {
                    alert(e.message);
                } finally {
                    btn.disabled = false;
                    btn.textContent = "추가 + 기동";
                    refresh();
                }
            });

            // 별칭 저장 (Enter / blur)
            async function saveAlias(inp) {
                const name = inp.dataset.name;
                const alias = inp.value.trim();
                const prev = serversCache.find((s) => s.name === name);
                if (prev && (prev.alias || prev.name) === (alias || name)) return;
                inp.disabled = true;
                try {
                    const r = await fetch(
                        "/api/servers/" + encodeURIComponent(name),
                        {
                            method: "PATCH",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ alias }),
                        },
                    );
                    const d = await r.json().catch(() => ({}));
                    if (!r.ok) throw new Error(d.error || "별칭 저장 실패");
                    if (prev) prev.alias = d.server?.alias ?? alias;
                } catch (e) {
                    alert(e.message);
                    if (prev) inp.value = prev.alias || prev.name;
                } finally {
                    inp.disabled = false;
                }
            }

            function sameSkills(a, b) {
                const aa = Array.isArray(a) ? a : [];
                const bb = Array.isArray(b) ? b : [];
                if (aa.length !== bb.length) return false;
                return aa.every((x, i) => x === bb[i]);
            }

            function sameIds(a, b) {
                const aa = Array.isArray(a) ? [...a].sort() : [];
                const bb = Array.isArray(b) ? [...b].sort() : [];
                return (
                    aa.length === bb.length && aa.every((x, i) => x === bb[i])
                );
            }

            async function saveSkills(name, panel) {
                const roleIds = collectCommonIds(panel);
                const skills = collectCustomValues(panel);
                const prev = serversCache.find((s) => s.name === name);
                if (
                    prev &&
                    sameIds(prev.roleIds || [], roleIds) &&
                    sameSkills(customOf(prev), skills)
                ) {
                    openSkillName = null;
                    roleDraft = null;
                    refresh();
                    return;
                }
                skillSaveBusy = true;
                const saveBtn = panel.querySelector(".skill-save");
                if (saveBtn) {
                    saveBtn.disabled = true;
                    saveBtn.textContent = "저장 중…";
                }
                try {
                    const r = await fetch(
                        "/api/servers/" + encodeURIComponent(name),
                        {
                            method: "PATCH",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ roleIds, skills }),
                        },
                    );
                    const d = await r.json().catch(() => ({}));
                    if (!r.ok) throw new Error(d.error || "역할 저장 실패");
                    if (prev && d.server) {
                        Object.assign(prev, d.server);
                    }
                    openSkillName = null;
                    roleDraft = null;
                } catch (e) {
                    alert(e.message);
                } finally {
                    skillSaveBusy = false;
                    if (saveBtn) {
                        saveBtn.disabled = false;
                        saveBtn.textContent = "저장";
                    }
                    refresh();
                }
            }

            function closeSkillAccordion() {
                openSkillName = null;
                roleDraft = null;
                refresh();
            }

            function openSkillAccordion(name) {
                if (openSkillName && openSkillName !== name) {
                    captureOpenSkillDraft();
                }
                if (openSkillName === name) {
                    closeSkillAccordion();
                    return;
                }
                openSkillName = name;
                roleDraft = null;
                refresh();
            }

            document.querySelector("table").addEventListener("keydown", (e) => {
                const inp = e.target.closest(".alias-edit");
                if (!inp || e.key !== "Enter") return;
                e.preventDefault();
                inp.blur();
            });
            document.querySelector("table").addEventListener("focusout", (e) => {
                const inp = e.target.closest?.(".alias-edit");
                if (!inp) return;
                saveAlias(inp);
            });

            // 역할 아코디언: 펼치기 / 커스텀 추가 / 삭제 / 저장 / 닫기
            document.querySelector("table").addEventListener("click", async (e) => {
                const toggle = e.target.closest(".skills-toggle");
                if (toggle) {
                    openSkillAccordion(toggle.dataset.name);
                    return;
                }

                const closeBtn = e.target.closest(".skill-close");
                if (closeBtn) {
                    closeSkillAccordion();
                    return;
                }

                const addBtn = e.target.closest(".skill-add");
                if (addBtn && addBtn.dataset.name) {
                    const panel = addBtn.closest(".skills-acc");
                    const rows = panel?.querySelector(".skill-rows");
                    if (!rows) return;
                    if (rows.querySelectorAll(".skill-row").length >= SKILL_MAX) {
                        alert(`커스텀 역할은 최대 ${SKILL_MAX}개까지 등록할 수 있습니다.`);
                        return;
                    }
                    const n = rows.querySelectorAll(".skill-row").length + 1;
                    rows.insertAdjacentHTML("beforeend", skillRowHtml("", n));
                    rows.querySelector(".skill-row:last-child .skill-ta")?.focus();
                    return;
                }

                const rm = e.target.closest(".skill-rm");
                if (rm) {
                    const panel = rm.closest(".skills-acc");
                    rm.closest(".skill-row")?.remove();
                    if (panel) renumberSkillRows(panel);
                    return;
                }

                const saveBtn = e.target.closest(".skill-save");
                if (saveBtn && saveBtn.dataset.name) {
                    const panel = saveBtn.closest(".skills-acc");
                    if (panel) await saveSkills(saveBtn.dataset.name, panel);
                    return;
                }

                const btn = e.target.closest(".del-btn");
                if (!btn || powerBusy) return;
                const name = btn.dataset.name;
                if (
                    !confirm(
                        `"${name}" 서버를 삭제할까요?\n실행 중이면 종료되고 servers.json 정의에서도 제거됩니다.`,
                    )
                )
                    return;
                powerBusy = true;
                try {
                    const r = await fetch(
                        "/api/servers/" + encodeURIComponent(name),
                        { method: "DELETE" },
                    );
                    const d = await r.json().catch(() => ({}));
                    if (!r.ok) alert(d.error || "삭제 실패");
                } catch (err) {
                    alert(err.message);
                } finally {
                    powerBusy = false;
                    refresh();
                }
            });

            // 모델 서버 전원 토글 (ON=기동, OFF=종료)
            document.querySelector("table").addEventListener("change", async (e) => {
                const inp = e.target;
                if (!inp.matches(".pw-toggle") || powerBusy) return;
                const name = inp.dataset.name;
                const turnOn = inp.checked;
                if (
                    !turnOn &&
                    !confirm(`"${name}" 모델 서버를 종료할까요?\nVRAM/메모리가 해제되고, 해당 백엔드는 다운 상태가 됩니다.`)
                ) {
                    inp.checked = true;
                    return;
                }
                powerBusy = true;
                inp.disabled = true;
                try {
                    const r = await fetch(
                        `/api/servers/${encodeURIComponent(name)}/${turnOn ? "start" : "stop"}`,
                        { method: "POST" },
                    );
                    const d = await r.json().catch(() => ({}));
                    if (!r.ok) {
                        inp.checked = !turnOn;
                        alert(d.error || "요청 실패");
                    }
                } catch (err) {
                    inp.checked = !turnOn;
                    alert(err.message);
                } finally {
                    powerBusy = false;
                    refresh();
                }
            });

            // 고정 기능 드롭다운 열기/닫기 (팝업은 body 포털)
            document.querySelector("table").addEventListener("click", (e) => {
                const btn = e.target.closest(".fixed-btn");
                if (!btn) return;
                e.stopPropagation();
                const url = btn.dataset.url;
                openFixedUrl = openFixedUrl === url ? null : url;
                document
                    .querySelectorAll(".fixed-btn")
                    .forEach((el) =>
                        el.setAttribute(
                            "aria-expanded",
                            el.dataset.url === openFixedUrl ? "true" : "false",
                        ),
                    );
                syncFixedPop();
            });
            document.addEventListener("click", (e) => {
                if (!openFixedUrl) return;
                if (
                    e.target.closest(".fixed-cell") ||
                    e.target.closest(".fixed-pop") ||
                    e.target.closest("#fixedPopPortal")
                ) {
                    return;
                }
                closeFixedPop();
            });
            window.addEventListener("resize", () => {
                if (openFixedUrl) syncFixedPop();
            });
            $("tableScroll")?.addEventListener(
                "scroll",
                () => {
                    if (openFixedUrl) closeFixedPop();
                },
                { passive: true },
            );

            // 고정 기능 토글 (포털 안 체크박스 — document 위임)
            document.addEventListener("change", async (e) => {
                const inp = e.target;
                if (!inp.matches?.(".role-toggle")) return;
                if (roleBusy) return;
                const url = inp.dataset.url;
                const role = inp.dataset.role;
                const enabled = inp.checked;
                openFixedUrl = url; // 토글 후에도 드롭다운 유지
                roleBusy = true;
                inp.disabled = true;
                try {
                    const r = await fetch("/api/backends/role", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ url, role, enabled }),
                    });
                    if (!r.ok) {
                        inp.checked = !enabled;
                        const err = await r.json().catch(() => ({}));
                        alert(err.error || "역할 변경에 실패했습니다.");
                    } else {
                        const d = await r.json();
                        if (Array.isArray(d.backends)) backendsCache = d.backends;
                        syncFixedPop();
                    }
                } catch (err) {
                    inp.checked = !enabled;
                    alert(err.message);
                } finally {
                    roleBusy = false;
                }
            });

            $("roleFilter").addEventListener("click", (e) => {
                const chip = e.target.closest(".rf-chip");
                if (!chip) return;
                const next = chip.dataset.filter || "all";
                if (roleFilter === next) return;
                roleFilter = next;
                openFixedUrl = null;
                // 캐시로 즉시 다시 그리거나 refresh
                refresh();
            });

            refresh();
            setInterval(refresh, 1000);
        </script>
        <script src="/nav.js"></script>
    </body>
</html>
