            });

            async function runStressTest(user, n) {
                const wall0 = performance.now();
                addUser(user, $("content").value.trim());
                const card = document.createElement("div");
                card.className = "msg assistant";
                card.innerHTML =
                    `<div class="stress-card">` +
                    `<div class="st-title">모델 스트레스 테스트 · ${n}회</div>` +
                    `<div class="st-row st-prog">준비 중…</div>` +
                    `<div class="st-board"></div>` +
                    `<div class="st-list"></div>` +
                    `</div>`;
                $("log").appendChild(card);
                const empty = $("log").querySelector(".chat-empty");
                if (empty) empty.remove();
                scrollDown();

                const prog = card.querySelector(".st-prog");
                const board = card.querySelector(".st-board");
                const list = card.querySelector(".st-list");

                const { body } = buildChatBody(user);
                delete body.HISTORY;
                delete body.WORKFLOW;
                delete body.RAG;
                body.COUNT = n;
                body.MODE = "parallel";
                body.STREAM = true;

                const resultsByI = new Map();
                let meta = { preferredTier: "–", difficulty: null, count: n };
                let donePayload = null;

                function renderRow(row) {
                    const line = document.createElement("div");
                    line.className = "st-item";
                    line.dataset.i = String(row.i);
                    if (!row.ok) {
                        line.innerHTML = `<span class="st-fail">#${row.i} FAIL</span>  ${row.ms}ms  ·  ${esc(String(row.error || "?"))}`;
                    } else {
                        const tierHtml =
                            row.tier === "large"
                                ? `<span style="color:#7aa2f7">large</span>`
                                : row.tier === "medium"
                                  ? `<span style="color:#e6a23c">medium</span>`
                                  : esc(String(row.tier || "?"));
                        line.innerHTML =
                            `<span class="st-ok">#${String(row.i).padStart(2, "0")} OK</span>  ` +
                            `${String(row.ms).padStart(5, " ")}ms  ${tierHtml}` +
                            (row.loadDemoted ? `  demote` : `       `) +
                            (row.answerLen != null
                                ? `  답 ${row.answerLen}자`
                                : "");
                    }
                    // 번호 순 삽입
                    const kids = [...list.children];
                    const next = kids.find(
                        (el) => Number(el.dataset.i) > row.i,
                    );
                    if (next) list.insertBefore(line, next);
                    else list.appendChild(line);
                }

                function refreshBoard(partial = true) {
                    const sorted = [...resultsByI.values()].sort(
                        (a, b) => (a.i || 0) - (b.i || 0),
                    );
                    const ok = sorted.filter((r) => r.ok).length;
                    const fail = sorted.filter((r) => !r.ok).length;
                    const countL = sorted.filter(
                        (r) => r.ok && r.tier === "large",
                    ).length;
                    const countM = sorted.filter(
                        (r) => r.ok && r.tier === "medium",
                    ).length;
                    const countS = sorted.filter(
                        (r) => r.ok && r.tier === "small",
                    ).length;
                    const demoted = sorted.filter((r) => r.loadDemoted).length;
                    const clientMs = Math.round(performance.now() - wall0);

                    const ranges = [];
                    for (const row of sorted) {
                        if (!row.ok) {
                            ranges.push({
                                from: row.i,
                                to: row.i,
                                tier: "FAIL",
                                demote: false,
                            });
                            continue;
                        }
                        const tier = row.tier || "?";
                        const demote = Boolean(row.loadDemoted);
                        const last = ranges[ranges.length - 1];
                        if (
                            last &&
                            last.tier === tier &&
                            last.demote === demote &&
                            last.to === row.i - 1
                        ) {
                            last.to = row.i;
                        } else {
                            ranges.push({
                                from: row.i,
                                to: row.i,
                                tier,
                                demote,
                            });
                        }
                    }
                    const rangeLines = ranges
                        .map((g) => {
                            const span =
                                g.from === g.to
                                    ? `#${g.from}`
                                    : `#${g.from}–${g.to}`;
                            const cnt = g.to - g.from + 1;
                            const tag =
                                g.tier === "large"
                                    ? `<span class="hl-l">large</span>`
                                    : g.tier === "medium"
                                      ? `<span class="hl-m">medium</span>`
                                      : g.tier === "FAIL"
                                        ? `<span class="st-fail">FAIL</span>`
                                        : esc(g.tier);
                            const dem = g.demote ? "  · load-demote" : "";
                            return `  ${span.padEnd(8)} ${tag}${dem}  (${cnt}건)`;
                        })
                        .join("\n");

                    const timeline = Array.from({ length: n }, (_, idx) => {
                        const row = resultsByI.get(idx + 1);
                        if (!row) return `<span class="hl-dim">·</span>`;
                        if (!row.ok) return `<span class="st-fail">·</span>`;
                        if (row.tier === "large")
                            return `<span class="hl-l">L</span>`;
                        if (row.tier === "medium")
                            return `<span class="hl-m">M</span>`;
                        if (row.tier === "small") return "S";
                        return "?";
                    }).join(" ");

                    const summary = donePayload?.summary || {};
                    const done = Boolean(donePayload);
                    prog.innerHTML = done
                        ? `<span class="st-ok">완료 ${ok} / ${n}</span>` +
                          (fail
                              ? ` · <span class="st-fail">실패 ${fail}</span>`
                              : "") +
                          ` · ${summary.wallMs ?? clientMs}ms`
                        : `<span class="st-ok">진행 ${ok + fail} / ${n}</span>` +
                          (fail
                              ? ` · <span class="st-fail">실패 ${fail}</span>`
                              : "") +
                          ` · ${clientMs}ms`;

                    board.innerHTML =
                        `<span class="hl-dim">${done ? "요약" : "진행 중"}</span>\n` +
                        `  총 ${n}회  ·  preferred ${esc(String(meta.preferredTier || "–"))}` +
                        (meta.difficulty != null
                            ? `  ·  diff ${esc(String(meta.difficulty))}`
                            : "") +
                        `\n` +
                        `  <span class="hl-l">large ${countL}</span>  ·  <span class="hl-m">medium ${countM}</span>` +
                        (countS ? `  ·  small ${countS}` : "") +
                        `  ·  demote ${demoted}\n` +
                        (summary.concurrency != null
                            ? `  동시 최대 ${summary.concurrency} / 슬롯합 ${summary.slotCap ?? "?"}\n`
                            : "") +
                        (done
                            ? `  벽시계 ${summary.wallMs ?? "?"}ms  ·  개별 ${summary.minMs ?? "?"}/${summary.avgMs ?? "?"}/${summary.maxMs ?? "?"}ms  ·  클라 ${clientMs}ms\n`
                            : `  경과 ${clientMs}ms\n`) +
                        `\n<span class="hl-dim">구간</span>\n` +
                        (rangeLines || `  <span class="hl-dim">(아직 없음)</span>`) +
                        `\n\n<span class="hl-dim">순서</span>  <span class="hl-dim">(L=large  M=medium  ·=대기)</span>\n` +
                        `  ${timeline}`;
                }

                try {
                    const r = await fetch("/api/chat/stress", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(body),
                    });
                    if (!r.ok) {
                        const j = await r.json().catch(() => ({}));
                        prog.innerHTML = `<span class="st-fail">실패</span> · ${esc(String(j.error || r.status))}`;
                        return;
                    }

                    const ctype = r.headers.get("content-type") || "";
                    if (!ctype.includes("text/event-stream") || !r.body) {
                        // 구버전 JSON 폴백
                        const j = await r.json().catch(() => ({}));
                        for (const row of j.results || []) {
                            resultsByI.set(row.i, row);
                            renderRow(row);
                        }
                        meta = {
                            preferredTier: j.preferredTier || j.routedTier,
                            difficulty: j.difficulty,
                            count: j.count || n,
                        };
                        donePayload = j;
                        refreshBoard(false);
                        return;
                    }

                    prog.textContent = "모델 호출 중… (완료되는 대로 표시)";
                    const reader = r.body.getReader();
                    const decoder = new TextDecoder();
                    let buf = "";
                    let curEvent = "message";

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        buf += decoder.decode(value, { stream: true });
                        const parts = buf.split("\n");
                        buf = parts.pop() || "";
                        for (const raw of parts) {
                            const line = raw.replace(/\r$/, "");
                            if (line.startsWith("event:")) {
                                curEvent = line.slice(6).trim();
                            } else if (line.startsWith("data:")) {
                                const dataStr = line.slice(5).trim();
                                let data = null;
                                try {
                                    data = JSON.parse(dataStr);
                                } catch {
                                    continue;
                                }
                                if (curEvent === "meta") {
                                    meta = {
                                        preferredTier:
                                            data.preferredTier || "–",
                                        difficulty: data.difficulty ?? null,
                                        count: data.count || n,
                                    };
                                    refreshBoard();
                                } else if (curEvent === "result") {
                                    resultsByI.set(data.i, data);
                                    renderRow(data);
                                    refreshBoard();
                                    scrollDown();
                                } else if (curEvent === "done") {
                                    donePayload = data;
                                    if (Array.isArray(data.results)) {
                                        for (const row of data.results) {
                                            if (!resultsByI.has(row.i)) {
                                                resultsByI.set(row.i, row);
                                                renderRow(row);
                                            }
                                        }
                                    }
                                    refreshBoard(false);
                                } else if (curEvent === "error") {
                                    prog.innerHTML = `<span class="st-fail">실패</span> · ${esc(String(data.error || "?"))}`;
                                }
                                curEvent = "message";
                            } else if (line === "") {
                                curEvent = "message";
                            }
                        }
                    }
                    if (!donePayload && resultsByI.size) refreshBoard(false);
                } catch (err) {
                    prog.innerHTML = `<span class="st-fail">실패</span> · ${esc(err.message || String(err))}`;
                }
                scrollDown();
            }

            const LS_LEFT = "neutda.console.leftMode";
            const LS_ASK_KEY = "neutda.console.apiKeyId";
            let apiKeysCache = [];
            let collectionsCache = [];
            let rulesCache = [];

            function isApiKeyMode() {
                return document.body.classList.contains("mode-apikey");
            }

            function knOf(k) {
                return (
                    k?.knowledge || {
                        collectionIds: [],
                        mode: "strict",
                        topK: 4,
                    }
                );
            }

            function renderAskKeyInfo() {
                const pane = $("askKeyInfo");
                const id = $("askKey").value;
                const key = apiKeysCache.find((k) => k.id === id);
                if (!key) {
                    pane.innerHTML =
                        '<div class="ask-empty">키를 선택하면 허용 티어·기초지식 바인딩이 표시됩니다.</div>';
                    const wrap0 = $("askCustomWrap");
                    if (wrap0) wrap0.hidden = true;

                }
                const kn = knOf(key);

                    .filter(Boolean);
                const boundRules = (ru.ruleIds || [])
                    .map((rid) => rulesCache.find((r) => r.id === rid))
                    .filter(Boolean);
                const chips = bound.length
                    ? bound
                          .map(
                              (c) =>
                                  `<span class="ask-chip">${esc(c.name)} · ${c.docCount}건</span>`,
                          )
                          .join("")
                    : '<span style="color:var(--muted)">미적용 (일반 답변)</span>';
                const ruleChips = boundRules.length
                    ? boundRules
                          .map(
                              (r) =>
                                  `<span class="ask-chip">${esc(r.name)} · ${(r.keywords || []).slice(0, 2).join(", ")}</span>`,
                          )
                          .join("")
                    : '<span style="color:var(--muted)">미적용</span>';
                const customOn = key.rules?.allowCustom === true;
                const wrap = $("askCustomWrap");
                if (wrap) wrap.hidden = !customOn;
                pane.innerHTML = `
                    <div class="ask-card">
                        <div class="row"><span class="k">이름</span><span class="v">${esc(key.name) || "(무명)"}</span></div>
                        <div class="row"><span class="k">키</span><span class="v" style="font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--accent)">${esc(key.keyMasked)}</span></div>
                        <div class="row"><span class="k">상태</span><span class="v">${key.enabled ? "활성" : "비활성"}</span></div>
                        <div class="row"><span class="k">허용 티어</span><span class="v">${esc((key.allowedTiers || []).join(", ") || "–")}</span></div>
                        <div class="row"><span class="k">기초지식</span><span class="v">${chips}</span></div>
                        <div class="row"><span class="k">JSON 결과</span><span class="v">${ruleChips}</span></div>
                        <div class="row"><span class="k">호출자 JSON</span><span class="v">${customOn ? "수락" : "거절"}</span></div>
                        <div class="row"><span class="k">모드</span><span class="v">${kn.mode === "augment" ? "보강 (augment)" : "문서만 (strict)"}</span></div>
                        <div class="row"><span class="k">topK</span><span class="v">${esc(kn.topK)}</span></div>
                    </div>
                `;
            }

            async function loadApiKeys() {
                try {
                    const [kd, cd, rd] = await Promise.all([
                        fetch("/api/keys").then((r) => r.json()),
                        fetch("/api/knowledge/collections").then((r) =>
                            r.json(),
                        ),
                        fetch("/api/rules").then((r) => r.json()),
                    ]);
                    apiKeysCache = kd.keys || [];
                    collectionsCache = cd.collections || [];
                    rulesCache = rd.rules || [];
                } catch {
                    apiKeysCache = [];
                    collectionsCache = [];
                    rulesCache = [];
                }
                const sel = $("askKey");
                const saved = localStorage.getItem(LS_ASK_KEY) || "";
                const pick =
                    (saved && apiKeysCache.some((k) => k.id === saved)
                        ? saved
                        : "") ||
                    (apiKeysCache[0] && apiKeysCache[0].id) ||
                    "";
                sel.innerHTML = apiKeysCache.length
                    ? `<option value="">키를 선택하세요</option>` +
                      apiKeysCache
                          .map(
                              (k) =>

            // 실제 토큰 사용 옵션 상태 복원·저장

            async function sendApiAsk(el, user, t0) {
                const key = apiKeysCache.find((k) => k.id === $("askKey").value);
                if (!key) {
                    fillError(el, "API 키를 선택하세요.");
                    return;
                }
                if (!key.enabled) {
                    fillError(el, "비활성 키입니다. 외부 API 관리에서 켜 주세요.");
                    return;
                }
                const params = new URLSearchParams({
                    key: key.key,
                    q: user,
                    WAIT: "Y",
                    ref: "console-" + Date.now().toString(36),
                });
                // 실제 토큰 사용 옵션: 해제 시 USAGE=N(집계·한도 제외)
                params.set(
                    "USAGE",
                    $("askRealUsage") && $("askRealUsage").checked ? "Y" : "N",
                );
                if ($("memory").checked) {
                    const uid = $("uid").value.trim();
                    const sid = $("sid").value.trim();
                    if (uid) params.set("U_ID", uid);
                    if (sid) params.set("S_ID", sid);
                }
                if (key.rules?.allowCustom === true) {
                    const schemaEl = $("askSchema");
                    const schemaRaw = schemaEl && schemaEl.value.trim();
                    if (schemaRaw) params.set("schema", schemaRaw);
                }
                // 긴 입력(코드리뷰 등)은 URL 한도를 넘겨 Header overflow 가 나므로
                // POST body 로 보낸다. (짧은 요청도 동일 처리)
                const r = await fetch("/api/ask", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(Object.fromEntries(params)),
                });
                const j = await r.json().catch(() => ({}));
                const ms = Math.round(performance.now() - t0);
                if (!r.ok || j.status === "error") {
                    fillError(
                        el,
                        j.error || j.message || `HTTP ${r.status}`,
                    );
                    return;
                }
                fillAssistant(
                    el,
                    {
                        answer: j.answer,
                        reasoning: j.reasoning,
                        model: j.model,
                        tier: j.tier,
                        device: j.device,
                        tokens: j.tokens,
                        rag: j.rag,
                        strict: j.strict,
                        sources: j.sources,
                        data: j.data,
                        rule: j.rule,
                        dryRun: j.dryRun,
                        counted: !j.dryRun && j.tokens != null,
                    },
                    ms,
                );
                convo.push({ role: "user", content: user });
                convo.push({
                    role: "assistant",
                    content: j.answer || "",
                });
                rememberTurn(user, {
                    answer: j.answer,
                    reasoning: j.reasoning,
                    model: j.model,
                    tier: j.tier,
                    device: j.device,
                    tokens: j.tokens,
                    ms,
                    dryRun: j.dryRun,
                    counted: !j.dryRun && j.tokens != null,
                    rag: j.rag,
                    strict: j.strict,
                    sources: j.sources,
                    mode: "ask",
                });
            }

            $("send").addEventListener("click", async () => {
                const btn = $("send");
                const user = $("user").value.trim();
                if (!user) {
                    alert("ROLE_USER 는 필수입니다.");
                    return;
                }

                if (isApiKeyMode()) {
                    addUser(user, $("content").value.trim());
                    const el = addAssistant();
                    btn.disabled = true;
                    $("user").value = "";
                    $("user").style.height = "auto";
                    const t0 = performance.now();
                    try {
                        await sendApiAsk(el, user, t0);
                    } catch (err) {
                        fillError(el, err.message);
                    } finally {
                        btn.disabled = false;
                    }
                    return;
                }

                if ($("stress").checked) {
                    let n = Math.floor(Number($("stressN").value) || 0);
                    if (n < 1) n = 1;
                    if (n > 32) n = 32;
                    $("stressN").value = String(n);
                    btn.disabled = true;
                    $("user").value = "";
                    $("user").style.height = "auto";
                    try {
                        await runStressTest(user, n);
                    } catch (err) {
                        alert("모델 스트레스 테스트 실패: " + err.message);
                    } finally {
                        btn.disabled = false;
                    }
                    return;
                }

                const { body, content, useRagPipeline } = buildChatBody(user);

                addUser(user, content);
                const el = addAssistant();
                btn.disabled = true;
                $("user").value = "";
                $("user").style.height = "auto";
                const t0 = performance.now();

                const useStream = $("stream").checked;
                try {
                    if ($("rag").checked && !useRagPipeline) {
                        await sendRag(el, user, t0, content || undefined);
                    } else if (useStream) {
                        await sendStream(el, body, user, t0);
                    } else {
                        const r = await fetch("/api/chat", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify(body),
                        });
                        const j = await r.json();
                        const ms = Math.round(performance.now() - t0);
                        if (!r.ok) {
                            fillError(el, j.error || r.status);
                        } else {
                            fillAssistant(el, j, ms);
                            convo.push({ role: "user", content: user });
                            convo.push({
                                role: "assistant",
                                content: j.answer || "",
                            });

            // 채팅 앱처럼: Enter 전송, Shift+Enter 줄바꿈 (한글 조합 중엔 무시)
            $("user").addEventListener("keydown", (e) => {
                if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
                    e.preventDefault();
                    if (!$("send").disabled) $("send").click();
                }
            });
            // 입력 내용에 따라 높이 자동 조절 (최대 140px)
            $("user").addEventListener("input", () => {
                const ta = $("user");
                ta.style.height = "auto";
                ta.style.height = Math.min(ta.scrollHeight, 140) + "px";
            });

            // SSE 응답 파싱: event/data 블록 단위로 handle(event, data) 호출
            async function readSse(r, handle) {
                const reader = r.body.getReader();
                const decoder = new TextDecoder();
                let buf = "";
                while (true) {
                    const { done: rdone, value } = await reader.read();
                    if (rdone) break;
                    buf += decoder.decode(value, { stream: true });
                    let sep;
                    while ((sep = buf.indexOf("\n\n")) >= 0) {
                        const chunk = buf.slice(0, sep);
                        buf = buf.slice(sep + 2);
                        const lines = chunk.split("\n");
                        let ev = "message";
                        let dataStr = "";
                        for (const ln of lines) {
                            if (ln.startsWith("event:"))
                                ev = ln.slice(6).trim();
                            else if (ln.startsWith("data:"))
                                dataStr += ln.slice(5).trim();
                        }
                        if (!dataStr) continue;
                        let data;
                        try {
                            data = JSON.parse(dataStr);
                        } catch {
                            continue;
                        }
                        handle(ev, data);
                    }
                }
            }

            // 스트리밍 응답 표시 준비: 커서 포함 텍스트 영역을 만들어 반환
            function startStreamText(el) {
                el.classList.remove("err");
                el.innerHTML =
                    '<span class="stream-text"></span><span class="cursor">▋</span>';
                return el.querySelector(".stream-text");
            }

            // SSE 스트리밍 전송: 토큰을 실시간으로 받아 표시
            async function sendStream(el, body, user, t0) {
                const r = await fetch("/api/chat/stream", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(body),
                });
                if (!r.ok || !r.body) {
                    let msg = r.status;
                    try {
                        msg = (await r.json()).error || msg;
                    } catch {}
                    fillError(el, msg);
                    return;
                }

                let answer = "";
                let meta = {};
                let done = null;
                let wfSteps = [];
                let holdMode = false; // 보안 게이트: 통과 전까지 답을 감춘다
                const textEl = startStreamText(el);
                // 스트리밍 중 파이프라인 상태 표시용
                const wfHost = document.createElement("div");
                wfHost.className = "wf-box";
                wfHost.style.display = "none";
                el.insertBefore(wfHost, el.firstChild);

                let statusEl = null;
                if (body.RAG) {
                    statusEl = document.createElement("div");
                    statusEl.className = "rag-status";
                    statusEl.style.cssText =
                        "color:var(--muted);font-size:.9em;margin-bottom:.4em";
                    statusEl.textContent = "문서 검색 중…";
                    el.insertBefore(statusEl, textEl);
                }

                function clearRagStatus() {
                    if (statusEl) {
                        statusEl.remove();
                        statusEl = null;
                    }
                }

                // 보안 게이트 대기 배너 (작성 중 / 보안 점검 중). token·meta 로 지워지지 않음.
                let holdEl = null;
                function setHold(msg) {
                    if (!holdEl) {
                        holdEl = document.createElement("div");
                        holdEl.className = "sec-hold";
                        holdEl.style.cssText =
                            "color:var(--muted);font-size:.9em;margin-bottom:.4em";
                        el.insertBefore(holdEl, textEl);
                    }
                    holdEl.textContent = msg;
                }
                function clearHold() {
                    if (holdEl) {
                        holdEl.remove();
                        holdEl = null;
                    }
                }

                function renderWfLive() {
                    if (!wfSteps.length) {
                        wfHost.style.display = "none";
                        return;
                    }
                    wfHost.style.display = "";
                    const flow = wfSteps.map((s) => s.tier).join(" → ");
                    wfHost.innerHTML =
                        `<div class="wf-title">파이프라인 진행 중 · ${esc(flow)}</div>` +
                        wfSteps
                            .map((s) => {
                                const cls =
                                    s.status === "done"
                                        ? "done"
                                        : s.status === "start"
                                          ? "on"
                                          : "";
                                const mark =
                                    s.status === "done"
                                        ? "✓"
                                        : s.status === "start"
                                          ? "…"
                                          : "·";
                                return `<div class="wf-step ${cls}"><span class="wf-role">${mark} ${s.i + 1}. ${esc(s.role)}</span>` +
                                    `<span class="tier-badge tier-${s.tier}">${esc(s.tier)}</span>` +
                                    `<span>${esc(s.instruction || "")}</span></div>`;
                            })
                            .join("");
                }

                await readSse(r, (event, data) => {
                    if (event === "status") {
                        if (statusEl)
                            statusEl.textContent =
                                data.message || statusEl.textContent;
                        scrollDown();
                    } else if (event === "token") {
                        if (holdMode) return; // 보안 대기 중엔 부분 답을 그리지 않음
                        clearRagStatus();
                        answer += data.text;
                        textEl.innerHTML = renderMd(answer);
                        scrollDown();
                    } else if (event === "security") {
                        if (data.type === "security_done") {
                            setHold(
                                data.allow === false
                                    ? "보안 정책에 따라 차단되었습니다."
                                    : "보안 점검 통과 · 표시 중…",
                            );
                        } else {
                            setHold("보안 점검 중입니다…");
                        }
                        scrollDown();
                    } else if (event === "meta") {
                        clearRagStatus();
                        meta = { ...meta, ...data };
                        if (data.securityHold) {
                            holdMode = true;
                            setHold("작성 중입니다…");
                        }
                        if (data.workflow?.length && !wfSteps.length) {
                            wfSteps = data.workflow.map((s) => ({
                                ...s,
                                status: "",
                            }));
                            renderWfLive();
                        }
                    } else if (event === "workflow") {
                        clearRagStatus();
                        if (data.steps?.length) {
                            wfSteps = data.steps.map((s) => ({
                                ...s,
                                status: "",
                            }));
                            renderWfLive();
                        }
                    } else if (event === "step") {
                        clearRagStatus();
                        const cur = wfSteps.find((s) => s.i === data.i);
                        if (cur) {
                            cur.status = data.status;
                            if (data.alias) cur.alias = data.alias;
                            if (data.ms != null) cur.ms = data.ms;
                            if (data.preview) cur.preview = data.preview;
                            if (data.instruction) cur.instruction = data.instruction;
                        } else if (data.status === "start") {
                            wfSteps.push({ ...data, status: "start" });
                        }
                        renderWfLive();
                    } else if (event === "done") {
                        clearRagStatus();
                        clearHold();
                        done = data;
                    } else if (event === "error") {
                        clearRagStatus();
                        clearHold();
                        fillError(el, data.error || "스트리밍 오류");
                    }
                });

                const ms = Math.round(performance.now() - t0);
                if (done) {
                    fillAssistant(
                        el,
                        {
                            answer: done.answer || answer,
                            reasoning: done.reasoning,
                            model: done.model,
                            tier: done.tier,
                            device: done.device,
                            alias: done.alias || meta.alias,
                            difficulty: done.difficulty,
                            routeReason: meta.reason,
                            deviceReason: meta.deviceReason,
                            ttftMs: done.ttftMs,
                            tokensPerSec: done.tokensPerSec,
                            tokens: done.tokens,
                            usage: done.usage,
                            mode: done.mode || meta.mode,
                            routeReason: done.routeReason || meta.reason,
                            routerBackend:
                                done.routerBackend || meta.routerBackend,
                            routerTier: done.routerTier || meta.routerTier,
                            routerAlias: done.routerAlias || meta.routerAlias,
                            routerDevice:
                                done.routerDevice || meta.routerDevice,
                            routerModel: done.routerModel || meta.routerModel,
                            workflowSteps:
                                done.workflowSteps ||
                                wfSteps.map((s) => ({
                                    tier: s.tier,
                                    role: s.role,
                                    alias: s.alias,
                                    ms: s.ms,
                                    instruction: s.instruction,
                                    preview: s.preview,
                                    device: s.device,
                                })),
                            workflowTrace: done.workflowTrace,
                            rag: done.rag || meta.rag || Boolean(body.RAG),
                            strict: done.strict ?? meta.strict ?? body.strict,
                            sources: done.sources || meta.sources || undefined,
                        },
                        ms,
                    );
                    convo.push({ role: "user", content: user });
                    convo.push({
                        role: "assistant",
                        content: done.answer || answer,
                    });
                    rememberTurn(user, {
                        answer: done.answer || answer,
                        reasoning: done.reasoning,
                        model: done.model,
                        tier: done.tier,
                        device: done.device,
                        alias: done.alias || meta.alias,
                        difficulty: done.difficulty,
                        routeReason: done.routeReason || meta.reason,
                        deviceReason: meta.deviceReason,
                        tokens: done.tokens,
                        usage: done.usage,
                        ms,
                        mode: done.mode || meta.mode,
                        routerBackend: done.routerBackend || meta.routerBackend,
                        routerTier: done.routerTier || meta.routerTier,
                        routerAlias: done.routerAlias || meta.routerAlias,
                        routerDevice: done.routerDevice || meta.routerDevice,
                        routerModel: done.routerModel || meta.routerModel,
                        workflowSteps: done.workflowSteps,
                        workflowTrace: done.workflowTrace,
                        rag: done.rag || meta.rag || Boolean(body.RAG),
                        strict: done.strict ?? meta.strict ?? body.strict,
                        sources: done.sources || meta.sources,
                    });
                } else if (answer) {
                    convo.push({ role: "user", content: user });
                    convo.push({ role: "assistant", content: answer });
                    rememberTurn(user, { answer });
                }
            }

            // ===== RAG: 문서기반 답변 =====
            // "문서기반 답변" 체크 시에만 "문서에 대한 것만 답변" 사용 가능
            function syncRagOnly() {
                const on = $("rag").checked;
                $("ragOnly").disabled = !on;
                $("ragOnlyWrap").classList.toggle("disabled", !on);
                if (!on) $("ragOnly").checked = false;
            }
            $("rag").addEventListener("change", syncRagOnly);
            syncRagOnly();

            async function sendRag(el, user, t0, content) {
                const strict = $("ragOnly").checked;
                const payload = { q: user, strict, topK: 4 };
                if (content) payload.content = content;
                const sys = $("system").value.trim();
                if (sys) payload.ROLE_SYSTEM = sys;
                if ($("memory").checked && convo.length > 0) {
                    payload.HISTORY = convo.slice(-12);
                }
                attachMemIds(payload);

                // 스트리밍 꺼짐: 기존 동기 방식
                if (!$("stream").checked) {
                    const r = await fetch("/api/rag/ask", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload),
                    });
                    const j = await r.json();
                    const ms = Math.round(performance.now() - t0);
                    if (!r.ok) {
                        fillError(el, j.error || r.status);
                        return;
                    }
                    fillRag(el, j, ms);
                    convo.push({ role: "user", content: user });
                    convo.push({ role: "assistant", content: j.answer || "" });
                    rememberTurn(user, j, { rag: true });
                    return;
                }

                // 스트리밍: 검색 상태부터 바로 표시 → 토큰 실시간 → 완료 시 출처
                el.classList.remove("err");
                el.innerHTML =
                    '<div class="rag-status" style="color:var(--muted);font-size:.9em;margin-bottom:.4em">문서 검색 중…</div><span class="stream-text"></span><span class="cursor">▋</span>';
                const statusEl = el.querySelector(".rag-status");
                const textEl = el.querySelector(".stream-text");

                const r = await fetch("/api/rag/ask/stream", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload),
                });
                if (!r.ok || !r.body) {
                    let msg = r.status;
                    try {
                        msg = (await r.json()).error || msg;
                    } catch {}
                    fillError(el, msg);
                    return;
                }

                let answer = "";
                let done = null;

                await readSse(r, (event, data) => {
                    if (event === "status") {
                        if (statusEl)
                            statusEl.textContent =
                                data.message || statusEl.textContent;
                        scrollDown();
                    } else if (event === "token") {
                        if (statusEl) statusEl.remove();
                        answer += data.text;
                        textEl.innerHTML = renderMd(answer);
                        scrollDown();
                    } else if (event === "done") {
                        done = data;
                    } else if (event === "error") {
                        fillError(el, data.error || "스트리밍 오류");
                    }
                });

                const ms = Math.round(performance.now() - t0);
                if (done) {
                    fillRag(el, done, ms);
                    convo.push({ role: "user", content: user });
                    convo.push({
                        role: "assistant",
                        content: done.answer || answer,
                    });
                    rememberTurn(user, done, { rag: true, answer: done.answer || answer });
                } else if (answer) {
                    convo.push({ role: "user", content: user });
                    convo.push({ role: "assistant", content: answer });
                    rememberTurn(user, { answer }, { rag: true });
                }
            }

            function fillRag(el, data, ms) {
                el.classList.remove("err");
                const tier = data.tier
                    ? `<span class="tier-badge tier-${data.tier}">${data.tier}</span>`
                    : "";
                const aliasBit = data.alias ? ` · ${esc(data.alias)}` : "";
                const dev = data.device
                    ? `<span class="dev-badge dev-${data.device}" title="${esc(data.alias || "")}">${data.device.toUpperCase()}${aliasBit}</span>`
                    : data.alias
                      ? `<span class="dev-badge dev-cpu">${esc(data.alias)}</span>`
                      : "";
                const mode = data.strict
                    ? '<span class="tier-badge tier-small">문서만</span>'
                    : '<span class="tier-badge tier-medium">문서기반</span>';
                const metaParts = [
                    data.model ? `model: ${esc(data.model)}` : null,
                    data.tokens != null ? `tokens: ${data.tokens}` : null,
                    ms != null ? `${ms} ms` : null,
                    data.dryRun
                        ? "🧪 사용량 미집계"
                        : data.counted
                          ? "✅ 사용량 집계"
                          : null,
                ].filter(Boolean);
                const cleanAnswer = (data.answer || "(빈 응답)")
                    .replace(/\s*\[출처[^\]]*\]/g, "")
                    .trim();
                let html = renderMd(cleanAnswer);
                if (data.sources && data.sources.length) {
                    html +=
                        `<details class="src-toggle"><summary>참고 문서 ${data.sources.length}개 보기</summary><div class="src-list">` +
                        data.sources
                            .map(
                                (s) =>
                                    `<div class="src-item"><div class="sh">[출처 ${s.n}] ${esc(s.docName)} #${s.idx} <span style="color:var(--muted);font-weight:400">(score ${s.score})</span></div><div class="sb">${esc(s.preview)}${s.preview.length >= 200 ? "…" : ""}</div></div>`,
                            )
                            .join("") +
                        "</div></details>";
                }
                html += `<div class="msg-meta">${mode}${tier}${dev}<span>${metaParts.join(" · ")}</span></div>`;
                el.innerHTML = html;
                scrollDown();
            }

            // ===== RAG 문서 관리 =====
            async function loadRagDocs() {
                try {
                    const r = await fetch("/api/rag/docs");
                    const d = await r.json();
                    const s = d.stats || {};
                    $("ragStats").textContent =
                        `문서 ${s.documents ?? 0} · 청크 ${s.chunks ?? 0}`;
                    const list = $("ragList");
                    if (!d.docs || !d.docs.length) {
                        list.innerHTML =
                            '<div class="sb" style="color:var(--muted)">추가된 문서가 없습니다.</div>';
                        return;
                    }
                    list.innerHTML = d.docs
                        .map(
                            (x) =>
                                `<div class="rag-doc"><div><div class="nm">${esc(x.name)}${x.kind === "image" ? ' <span style="color:var(--accent);font-size:10px">이미지</span>' : ""}</div><div class="sb">청크 ${x.chunkCount}개</div></div><button class="btn-sm" data-id="${x.id}">삭제</button></div>`,
                        )
                        .join("");
                    list.querySelectorAll("button[data-id]").forEach((b) => {
                        b.addEventListener("click", () =>
                            delRagDoc(b.dataset.id),
                        );
                    });
                } catch {
                    /* 무시 */
                }
            }

            async function delRagDoc(id) {
                if (!confirm("이 문서를 삭제할까요?")) return;
                await fetch("/api/rag/docs/" + encodeURIComponent(id), {
                    method: "DELETE",
                });
                loadRagDocs();
            }

            // 파일 선택 시: 바이너리(PDF/Word/HWP 등)는 서버에서 추출하므로 즉시 업로드
            $("ragFile").addEventListener("change", async (e) => {
                const files = Array.from(e.target.files || []);
                if (!files.length) return;
                await uploadRagFiles(files);
                $("ragFile").value = "";
            });

            async function uploadRagFiles(files) {
                const btn = $("ragAdd");
                const hint = $("ragFileHint");
                btn.disabled = true;
                // 파일이 1개일 때만 제목 입력칸을 적용한다.
                const allowName = files.length === 1;
                let ok = 0;
                const failed = [];
                for (let i = 0; i < files.length; i++) {
                    const f = files[i];
                    hint.textContent = `(${i + 1}/${files.length}) "${f.name}" 업로드/추출 중…`;
                    try {
                        const fd = new FormData();
                        fd.append("file", f);
                        const name = allowName ? $("ragName").value.trim() : "";
                        if (name) fd.append("name", name);
                        const r = await fetch("/api/rag/upload", {
                            method: "POST",
                            body: fd,
                        });
                        const d = await r.json();
                        if (!r.ok) throw new Error(d.error || "실패");
                        ok++;
                    } catch (err) {
                        failed.push(`${f.name}: ${err.message}`);
                    }
                    loadRagDocs();
                }
                $("ragName").value = "";
                hint.textContent =
                    `완료: ${ok}개 추가` +
                    (failed.length ? ` · 실패 ${failed.length}개` : "");
                if (failed.length) {
                    alert("일부 파일 업로드 실패:\n" + failed.join("\n"));
                }
                btn.disabled = false;
            }

            // 붙여넣은 텍스트로 문서 추가
            $("ragAdd").addEventListener("click", async () => {
                const name = $("ragName").value.trim();
                const text = $("ragText").value.trim();
                if (!text) {
                    alert("문서 내용을 붙여넣거나, 위에서 파일을 선택하세요.");
                    return;
                }
                const btn = $("ragAdd");
                btn.disabled = true;
                btn.textContent = "추가 중…";
                try {
                    const r = await fetch("/api/rag/docs", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ name, text }),
                    });
                    const d = await r.json();
                    if (!r.ok) throw new Error(d.error || "실패");
                    $("ragName").value = "";
                    $("ragText").value = "";
                    loadRagDocs();
                } catch (err) {
                    alert("추가 실패: " + err.message);
                } finally {
                    btn.disabled = false;
                    btn.textContent = "문서 추가";
                }
            });

            loadRagDocs();
            loadApiKeys().then(() => {
                const saved = localStorage.getItem(LS_LEFT);
                setLeftMode(saved === "apikey" ? "apikey" : "console");
            });
        </script>
        <script src="/nav.js"></script>
    </body>
</html>
