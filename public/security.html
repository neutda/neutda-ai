<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>neutda-ai · 보안 관리</title>
        <link rel="stylesheet" href="/dashboard.css" />
        <style>
            html,
            body {
                height: 100%;
                overflow: hidden;
            }
            body {
                display: flex;
                flex-direction: column;
            }
            .wrap.security-page {
                flex: 1;
                min-height: 0;
                width: 100%;
                box-sizing: border-box;
                display: flex;
                flex-direction: column;
                padding: 0;
            }
            .security-page > .app-main {
                flex: 1;
                min-height: 0;
                overflow: hidden;
                padding: 14px 20px 16px;
                display: flex;
                flex-direction: column;
                gap: 12px;
            }
            .sec-master {
                display: inline-flex;
                align-items: center;
                gap: 10px;
            }
            .sec-master-lab {
                font-size: 13px;
                font-weight: 700;
                color: var(--muted);
            }
            .sec-master-lab.on {
                color: var(--ok);
            }
            .sec-master-lab.off {
                color: #f07178;
            }
            .security-page > .app-main > .lead {
                margin: 0;
                flex-shrink: 0;
                font-size: 13px;
            }
            .layout {
                flex: 1;
                min-height: 0;
                display: grid;
                grid-template-columns: minmax(260px, 0.9fr) minmax(340px, 1.4fr);
                gap: 14px;
                align-items: stretch;
            }
            @media (max-width: 900px) {
                html,
                body {
                    overflow: auto;
                    height: auto;
                }
                .wrap.security-page {
                    height: auto;
                    flex: none;
                }
                .layout {
                    grid-template-columns: 1fr;
                    flex: none;
                    min-height: 0;
                }
                .policy-list,
                .assign-grid {
                    max-height: 50vh;
                }
            }
            .panel {
                display: flex;
                flex-direction: column;
                min-height: 0;
                overflow: hidden;
            }
            .panel-head {
                display: flex;
                align-items: center;
                gap: 10px;
                margin-bottom: 10px;
                flex-shrink: 0;
            }
            .panel-head .k {
                margin: 0;
                flex: 1;
            }
            .btn-row {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
            }
            .btn {
                border: 1px solid var(--border);
                border-radius: 7px;
                background: transparent;
                color: var(--text);
                padding: 8px 14px;
                font-size: 12px;
                font-weight: 700;
                cursor: pointer;
                font-family: inherit;
            }
            .btn.primary {
                background: var(--accent);
                border-color: var(--accent);
                color: #fff;
            }
            .btn.primary:hover {
                background: #5570e6;
            }
            .btn.danger {
                color: #ff9c95;
                border-color: rgba(248, 81, 73, 0.35);
            }
            .btn.ghost {
                padding: 5px 10px;
                font-size: 11px;
            }
            .btn:disabled {
                opacity: 0.55;
                cursor: wait;
            }
            .policy-list,
            .assign-grid {
                display: flex;
                flex-direction: column;
                gap: 8px;
                flex: 1;
                min-height: 0;
                overflow: auto;
            }
            .policy-item {
                display: grid;
                grid-template-columns: 1fr auto;
                gap: 8px;
                align-items: start;
                border: 1px solid var(--border);
                border-radius: 10px;
                padding: 12px 14px;
                background: #0d0f15;
                cursor: pointer;
            }
            .policy-item:hover {
                border-color: rgba(108, 140, 255, 0.45);
            }
            .policy-item.active {
                border-color: var(--accent);
                background: rgba(108, 140, 255, 0.08);
            }
            .policy-item .name {
                font-size: 14px;
                font-weight: 700;
            }
            .policy-item .desc {
                font-size: 12px;
                color: var(--muted);
                margin-top: 4px;
                white-space: pre-wrap;
            }
            .policy-item .meta {
                font-size: 11px;
                color: var(--muted);
                margin-top: 6px;
            }
            .policy-item .actions {
                display: flex;
                flex-direction: column;
                gap: 6px;
            }
            .assign-row {
                display: grid;
                grid-template-columns: auto 1fr;
                gap: 10px 12px;
                align-items: start;
                padding: 12px 14px;
                border: 1px solid var(--border);
                border-radius: 10px;
                background: #0d0f15;
                font-size: 13px;
            }
            .assign-row:has(.assign-cb:checked) {
                border-color: rgba(108, 140, 255, 0.45);
                background: rgba(108, 140, 255, 0.06);
            }
            .assign-row > label.check {
                display: flex;
                align-items: center;
                padding-top: 2px;
                cursor: pointer;
            }
            .assign-row .body {
                min-width: 0;
            }
            .assign-row .top {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 8px;
            }
            .assign-row .alias {
                font-weight: 700;
                font-size: 14px;
            }
            .assign-row .name {
                font-size: 11px;
                color: var(--muted);
            }
            .assign-row .badges {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                margin-left: auto;
            }
            .assign-row .meta {
                display: flex;
                flex-wrap: wrap;
                gap: 6px 14px;
                margin-top: 8px;
                font-size: 12px;
                color: var(--muted);
            }
            .assign-row .meta b {
                color: var(--text);
                font-weight: 600;
            }
            .assign-row .model {
                margin-top: 6px;
                font-size: 12px;
                color: var(--muted);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .assign-foot {
                margin-top: 10px;
                padding-top: 10px;
                border-top: 1px solid var(--border);
                display: flex;
                align-items: center;
                gap: 10px;
                flex-shrink: 0;
            }
            .assign-foot .hint {
                flex: 1;
                font-size: 12px;
                color: var(--muted);
            }
            .empty {
                color: var(--muted);
                font-size: 13px;
                padding: 16px 4px;
            }
            .badge-sec {
                display: inline-flex;
                align-items: center;
                padding: 2px 8px;
                border-radius: 999px;
                font-size: 10px;
                font-weight: 700;
                letter-spacing: 0.02em;
                background: rgba(63, 185, 80, 0.12);
                color: #7ee787;
                border: 1px solid rgba(63, 185, 80, 0.35);
            }
            /* modal */
            .modal-backdrop {
                position: fixed;
                inset: 0;
                background: rgba(6, 8, 14, 0.72);
                display: none;
                align-items: center;
                justify-content: center;
                z-index: 200;
                padding: 20px;
            }
            .modal-backdrop.open {
                display: flex;
            }
            .modal {
                width: min(520px, 100%);
                background: #12151d;
                border: 1px solid var(--border);
                border-radius: 14px;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
                padding: 20px 22px;
            }
            .modal h2 {
                margin: 0 0 14px;
                font-size: 16px;
                font-weight: 700;
            }
            .modal label {
                display: flex;
                flex-direction: column;
                gap: 4px;
                font-size: 11px;
                color: var(--muted);
                font-weight: 600;
                margin-bottom: 12px;
            }
            .modal input,
            .modal textarea {
                background: #0d0f15;
                border: 1px solid var(--border);
                border-radius: 7px;
                color: var(--text);
                padding: 9px 11px;
                font-size: 13px;
                font-family: inherit;
            }
            .modal textarea {
                min-height: 80px;
                resize: vertical;
            }
            #policyBody {
                min-height: 140px;
            }
            .modal input:focus,
            .modal textarea:focus {
                outline: none;
                border-color: var(--accent);
            }
            .modal-actions {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                margin-top: 4px;
            }
            .modal-actions .spacer {
                flex: 1;
            }
        </style>
            <link rel="stylesheet" href="/nav.css" />
    </head>
    <body>
        <div class="wrap security-page">
            <header>
                <h1>보안 관리</h1>
                <div class="tools sec-master">
                    <span class="sec-master-lab" id="secEnabledLabel">보안검증</span>
                    <label class="role-switch" title="끄면 최종 답변 보안 게이트를 건너뜁니다">
                        <input type="checkbox" id="secEnabled" />
                        <span class="role-slider"></span>
                    </label>
                    <span id="updated" class="updated"></span>
                </div>
            </header>
            <div class="app-main">
            <p class="muted lead">
                상단 스위치로 보안검증 전체를 끌 수 있습니다(정책·배정은 유지).
                켜 둔 상태에서도 답변 토큰은 실시간 스트리밍되며, 차단 시에만 최종
                문구가 교체됩니다. 정책은 서버/모델관리의 «보안검증»이 켜진 모델에만
                입힐 수 있습니다.
            </p>

            <div class="layout">
                <div class="card panel">
                    <div class="panel-head">
                        <div class="k">
                            정책
                            <span
                                class="muted"
                                id="policyCount"
                                style="font-weight: 400"
                            ></span>
                        </div>
                        <button id="btnNew" class="btn primary" type="button">
                            + 새 정책
                        </button>
                    </div>
                    <div id="policyList" class="policy-list">
                        <div class="empty">불러오는 중…</div>
                    </div>
                </div>

                <div class="card panel">
                    <div class="panel-head">
                        <div class="k" id="assignTitle">
                            모델을 입히려면 정책을 선택하세요
                        </div>
                    </div>
                    <div id="assignGrid" class="assign-grid"></div>
                    <div class="assign-foot">
                        <span class="hint" id="assignHint"
                            >왼쪽 정책 목록에서 정책을 선택하세요.</span
                        >
                        <button id="btnAssign" class="btn primary" disabled>
                            배정 저장
                        </button>
                    </div>
                </div>
            </div>
            </div>
        </div>

        <div
            id="policyModal"
            class="modal-backdrop"
            role="dialog"
            aria-modal="true"
            aria-labelledby="formTitle"
        >
            <div class="modal">
                <h2 id="formTitle">새 보안 정책 만들기</h2>
                <input type="hidden" id="editId" value="" />
                <label>
                    정책 이름
                    <input
                        id="policyName"
                        type="text"
                        maxlength="40"
                        placeholder="예: 개인정보 마스킹"
                    />
                </label>
                <label>
                    설명 (선택)
                    <textarea
                        id="policyDesc"
                        maxlength="200"
                        placeholder="예: 주민번호·연락처 등 민감 정보 노출 차단"
                    ></textarea>
                </label>
                <label>
                    보안 내역 (필수)
                    <textarea
                        id="policyBody"
                        maxlength="6000"
                        placeholder="예: 답변에 주민등록번호, 전화번호, 이메일, 계좌번호 등 개인식별정보를 포함하지 마세요. 포함된 경우 [마스킹됨]으로 대체하세요."
                    ></textarea>
                </label>
                <div class="modal-actions">
                    <button
                        id="btnDelete"
                        class="btn danger"
                        type="button"
                        hidden
                    >
                        삭제
                    </button>
                    <span class="spacer"></span>
                    <button id="btnCancel" class="btn" type="button">
                        취소
                    </button>
                    <button id="btnSave" class="btn primary" type="button">
                        정책 저장
                    </button>
                </div>
            </div>
        </div>

        <script>
            const $ = (id) => document.getElementById(id);
            const esc = (s) =>
                String(s ?? "")
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;");

            let policies = [];
            let servers = [];
            let selectedId = null;

            function securityServers() {
                return servers.filter((s) => s.security === true);
            }

            function openModal({
                id = "",
                name = "",
                description = "",
                body = "",
            } = {}) {
                $("editId").value = id;
                $("policyName").value = name;
                $("policyDesc").value = description;
                $("policyBody").value = body;
                if (id) {
                    $("formTitle").textContent = `보안 정책 수정 · ${name}`;
                    $("btnDelete").hidden = false;
                    $("btnSave").textContent = "변경 저장";
                } else {
                    $("formTitle").textContent = "새 보안 정책 만들기";
                    $("btnDelete").hidden = true;
                    $("btnSave").textContent = "정책 저장";
                }
                $("policyModal").classList.add("open");
                setTimeout(() => $("policyName").focus(), 30);
            }

            function closeModal() {
                $("policyModal").classList.remove("open");
            }

            function clearSelection() {
                selectedId = null;
                $("assignTitle").textContent =
                    "모델을 입히려면 정책을 선택하세요";
                $("assignHint").textContent =
                    "왼쪽 정책 목록에서 정책을 선택하세요.";
                $("btnAssign").disabled = true;
                renderPolicyList();
                renderAssign();
            }

            function selectPolicy(id) {
                const policy = policies.find((p) => p.id === id);
                if (!policy) return clearSelection();
                selectedId = id;
                $("assignTitle").textContent =
                    `"${policy.name}" 을(를) 입힐 모델`;
                $("assignHint").textContent =
                    "체크한 모델에 이 보안 정책이 배정됩니다.";
                $("btnAssign").disabled = false;
                renderPolicyList();
                renderAssign();
            }

            function renderPolicyList() {
                $("policyCount").textContent = `(${policies.length})`;
                if (!policies.length) {
                    $("policyList").innerHTML =
                        '<div class="empty">아직 보안 정책이 없습니다. «새 정책»으로 만들어 보세요.</div>';
                    return;
                }
                $("policyList").innerHTML = policies
                    .map((p) => {
                        const n = securityServers().filter((s) =>
                            (s.securityIds || []).includes(p.id),
                        ).length;
                        return `
        <div class="policy-item ${p.id === selectedId ? "active" : ""}" data-id="${esc(p.id)}">
          <div>
            <div class="name">${esc(p.name)}</div>
            <div class="desc">${esc(p.description || "(설명 없음)")}</div>
            <div class="meta">배정 ${n}대</div>
          </div>
          <div class="actions">
            <button type="button" class="btn ghost policy-edit" data-id="${esc(p.id)}">수정</button>
          </div>
        </div>`;
                    })
                    .join("");
            }

            function renderAssign() {
                const secServers = securityServers();
                if (!selectedId) {
                    $("assignGrid").innerHTML =
                        '<div class="empty">왼쪽에서 정책을 선택하면 모델 목록이 나타납니다.</div>';
                    return;
                }
                if (!secServers.length) {
                    $("assignGrid").innerHTML =
                        '<div class="empty">보안검증이 켜진 모델이 없습니다. 서버/모델관리에서 «보안검증» 기능을 먼저 켜 주세요.</div>';
                    return;
                }
                $("assignGrid").innerHTML = secServers
                    .map((s) => {
                        const on = (s.securityIds || []).includes(selectedId);
                        const alias = s.alias || s.name;
                        const modelFile = s.model
                            ? String(s.model).split(/[\\/]/).pop()
                            : "–";
                        const device =
                            s.device || (Number(s.ngl) > 0 ? "gpu" : "cpu");
                        const deviceLabel = device.toUpperCase();
                        const gpuLabel =
                            device === "gpu"
                                ? s.gpu !== undefined && s.gpu !== ""
                                    ? `GPU ${s.gpu}`
                                    : "GPU"
                                : "CPU";
                        const status = s.healthy
                            ? '<span class="pill up"><span class="dot"></span>정상</span>'
                            : s.running
                              ? '<span class="pill down"><span class="dot"></span>로딩</span>'
                              : '<span class="pill down"><span class="dot"></span>OFF</span>';
                        const policyN = (s.securityIds || []).length;
                        return `<div class="assign-row">
          <label class="check">
            <input type="checkbox" class="assign-cb" data-name="${esc(s.name)}" ${on ? "checked" : ""}>
          </label>
          <div class="body">
            <div class="top">
              <span class="alias">${esc(alias)}</span>
              ${alias !== s.name ? `<span class="name">${esc(s.name)}</span>` : ""}
              <div class="badges">
                <span class="badge-sec">보안검증 ON</span>
                <span class="tier tier-${esc(s.tier || "")}">${esc(s.tier || "–")}</span>
                <span class="dev dev-${esc(device)}">${esc(deviceLabel)}</span>
                ${status}
              </div>
            </div>
            <div class="meta">
              <span><b>${esc(gpuLabel)}</b>${device === "gpu" && s.ngl != null ? ` · ngl ${esc(s.ngl)}` : ""}</span>
              <span>ctx <b>${esc(s.ctx ?? "–")}</b></span>
              <span>port <b>${esc(s.port ?? "–")}</b></span>
              <span>${esc(s.url || "")}</span>
              <span>보안 정책 <b>${policyN}</b>개</span>
            </div>
            <div class="model" title="${esc(s.model || "")}">모델 ${esc(modelFile)}</div>
          </div>
        </div>`;
                    })
                    .join("");
            }

            async function refresh() {
                const [rp, rs] = await Promise.all([
                    fetch("/api/security-policies"),
                    fetch("/api/servers"),
                ]);
                const pd = await rp.json();
                const sd = await rs.json();
                if (!rp.ok) throw new Error(pd.error || "정책 로드 실패");
                if (!rs.ok) throw new Error(sd.error || "서버 로드 실패");
                policies = pd.policies || [];
                servers = sd.servers || [];
                const on = pd.enabled !== false;
                const tog = $("secEnabled");
                const lab = $("secEnabledLabel");
                if (tog) tog.checked = on;
                if (lab) {
                    lab.textContent = on ? "보안검증 ON" : "보안검증 OFF";
                    lab.classList.toggle("on", on);
                    lab.classList.toggle("off", !on);
                }
                if (
                    selectedId &&
                    !policies.some((p) => p.id === selectedId)
                ) {
                    clearSelection();
                } else {
                    renderPolicyList();
                    renderAssign();
                }
                $("updated").textContent =
                    "갱신 " + new Date().toLocaleTimeString();
            }

            $("secEnabled").addEventListener("change", async () => {
                const enabled = $("secEnabled").checked;
                const lab = $("secEnabledLabel");
                try {
                    const r = await fetch("/api/security/enabled", {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ enabled }),
                    });
                    const d = await r.json();
                    if (!r.ok) throw new Error(d.error || "저장 실패");
                    if (lab) {
                        lab.textContent = d.enabled
                            ? "보안검증 ON"
                            : "보안검증 OFF";
                        lab.classList.toggle("on", d.enabled);
                        lab.classList.toggle("off", !d.enabled);
                    }
                    $("updated").textContent =
                        "갱신 " + new Date().toLocaleTimeString();
                } catch (err) {
                    $("secEnabled").checked = !enabled;
                    alert(err.message || "보안검증 스위치 변경 실패");
                }
            });

            $("policyList").addEventListener("click", (e) => {
                const edit = e.target.closest(".policy-edit");
                if (edit) {
                    e.stopPropagation();
                    const policy = policies.find(
                        (p) => p.id === edit.dataset.id,
                    );
                    if (!policy) return;
                    openModal({
                        id: policy.id,
                        name: policy.name,
                        description: policy.description || "",
                        body: policy.body || "",
                    });
                    return;
                }
                const item = e.target.closest(".policy-item");
                if (!item) return;
                selectPolicy(item.dataset.id);
            });

            $("btnNew").addEventListener("click", () => openModal());
            $("btnCancel").addEventListener("click", closeModal);
            $("policyModal").addEventListener("click", (e) => {
                if (e.target === $("policyModal")) closeModal();
            });
            document.addEventListener("keydown", (e) => {
                if (
                    e.key === "Escape" &&
                    $("policyModal").classList.contains("open")
                ) {
                    closeModal();
                }
            });

            $("btnSave").addEventListener("click", async () => {
                const name = $("policyName").value.trim();
                const body = $("policyBody").value.trim();
                if (!name) {
                    $("policyName").focus();
                    return;
                }
                if (!body) {
                    $("policyBody").focus();
                    return;
                }
                const payload = {
                    name,
                    description: $("policyDesc").value.trim(),
                    body,
                };
                const id = $("editId").value;
                const btn = $("btnSave");
                btn.disabled = true;
                try {
                    const r = await fetch(
                        id
                            ? "/api/security-policies/" +
                              encodeURIComponent(id)
                            : "/api/security-policies",
                        {
                            method: id ? "PATCH" : "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify(payload),
                        },
                    );
                    const d = await r.json().catch(() => ({}));
                    if (!r.ok) throw new Error(d.error || "저장 실패");
                    closeModal();
                    await refresh();
                    selectPolicy(d.policy.id);
                } catch (e) {
                    alert(e.message);
                } finally {
                    btn.disabled = false;
                }
            });

            $("btnDelete").addEventListener("click", async () => {
                const id = $("editId").value;
                if (!id) return;
                if (
                    !confirm(
                        "이 보안 정책을 삭제할까요?\n모델에 입혀진 배정도 함께 해제됩니다.",
                    )
                )
                    return;
                try {
                    const r = await fetch(
                        "/api/security-policies/" + encodeURIComponent(id),
                        { method: "DELETE" },
                    );
                    const d = await r.json().catch(() => ({}));
                    if (!r.ok) throw new Error(d.error || "삭제 실패");
                    closeModal();
                    if (selectedId === id) clearSelection();
                    await refresh();
                } catch (e) {
                    alert(e.message);
                }
            });

            $("btnAssign").addEventListener("click", async () => {
                if (!selectedId) return;
                const btn = $("btnAssign");
                btn.disabled = true;
                btn.textContent = "저장 중…";
                try {
                    const checks = [
                        ...document.querySelectorAll(".assign-cb"),
                    ];
                    for (const cb of checks) {
                        const name = cb.dataset.name;
                        const sv = servers.find((s) => s.name === name);
                        if (!sv || sv.security !== true) continue;
                        const set = new Set(sv.securityIds || []);
                        if (cb.checked) set.add(selectedId);
                        else set.delete(selectedId);
                        const next = [...set];
                        const prev = sv.securityIds || [];
                        if (
                            next.length === prev.length &&
                            next.every((x) => prev.includes(x))
                        )
                            continue;
                        const r = await fetch(
                            "/api/servers/" + encodeURIComponent(name),
                            {
                                method: "PATCH",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ securityIds: next }),
                            },
                        );
                        const d = await r.json().catch(() => ({}));
                        if (!r.ok) throw new Error(d.error || "배정 실패");
                    }
                    await refresh();
                    selectPolicy(selectedId);
                } catch (e) {
                    alert(e.message);
                } finally {
                    btn.disabled = false;
                    btn.textContent = "배정 저장";
                }
            });

            refresh().catch((e) => {
                $("policyList").innerHTML =
                    `<div class="empty" style="color:var(--err)">${esc(e.message)}</div>`;
            });
        </script>
        <script src="/nav.js"></script>
    </body>
</html>
