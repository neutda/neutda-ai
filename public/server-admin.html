                                };
                                srvEd.needsRestart = false;
                            } else if (srvEd.pid) {
                                const r = srvEd.runningConfig;
                                srvEd.needsRestart = r
                                    ? Number(r.ngl) !== body.ngl ||
                                      Number(r.ctx) !== body.ctx ||
                                      Number(r.parallel || 0) !== body.parallel ||
                                      String(r.gpu || "") !== String(body.gpu || "")
                                    : true;
                            }
                        }
                        if (act === "save-restart") {
                            await call("POST", `${P}/servers/${encodeURIComponent(name)}/restart`);
                        }
                        if (msg) {
                            msg.textContent =
                                act === "save-restart"
                                    ? "저장·재시작됨"
                                    : "저장됨 (실행 설정은 재시작 후 반영)";
                            msg.className = "msg ok";
                        }
                        openEditor = null;
                        frozen = !!openAdd;
                        document.body.classList.remove("editor-open");
                    } else if (act === "save-res" || act === "save-res-restart") {
                        const box = el.closest(".res-edit");
                        if (!box) return;
                        const nglV = Number(box.querySelector('[data-rf="ngl"]')?.value);
                        const ctxV = Number(box.querySelector('[data-rf="ctx"]')?.value);
                        const parV = Number(box.querySelector('[data-rf="parallel"]')?.value);
                        const gpuV = box.querySelector('[data-rf="gpu"]')?.value.trim() ?? "";
                        await call("PATCH", `${P}/servers/${encodeURIComponent(name)}`, {
                            ngl: Number.isFinite(nglV) ? nglV : 0,
                            ctx: Number.isFinite(ctxV) && ctxV >= 512 ? ctxV : 4096,
                            parallel:
                                Number.isFinite(parV) && parV >= 1
                                    ? Math.min(32, Math.floor(parV))
                                    : 4,
                            gpu: nglV > 0 ? gpuV : "",
                        });
                        // 로컬 목록도 즉시 반영
                        const srv = nodeById(id)?.servers?.find((x) => x.name === name);
                        if (srv) {
                            srv.ngl = Number.isFinite(nglV) ? nglV : 0;
                            srv.ctx = Number.isFinite(ctxV) && ctxV >= 512 ? ctxV : 4096;
                            srv.parallel =
                                Number.isFinite(parV) && parV >= 1
                                    ? Math.min(32, Math.floor(parV))
                                    : 4;
                            srv.gpu = nglV > 0 ? gpuV : "";
                            srv.device = srv.ngl > 0 ? "gpu" : "cpu";
                            if (act === "save-res-restart") {
                                srv.runningConfig = {
                                    ngl: srv.ngl,
                                    ctx: srv.ctx,
                                    parallel: srv.parallel,
                                    gpu: srv.gpu,
                                };
                                srv.needsRestart = false;
                            } else if (srv.pid) {
                                const r = srv.runningConfig;
                                srv.needsRestart = r
                                    ? Number(r.ngl) !== srv.ngl ||
                                      Number(r.ctx) !== srv.ctx ||
                                      Number(r.parallel || 0) !== Number(srv.parallel || 0) ||
                                      String(r.gpu || "") !== String(srv.gpu || "")
                                    : true;
                            }
                        }
                        if (act === "save-res-restart") {
                            await call("POST", `${P}/servers/${encodeURIComponent(name)}/restart`);
                        }
                        renderMain();
                        frozen = !!openAdd || !!openEditor;
                    } else if (act === "do-add") {
                        const e = selEntry(id);
                        if (!e) {
                            alert("모델을 선택하세요.");
                            return;
                        }
                        const form = addForm();
                        const g = (f) => form.querySelector(`[data-f="${f}"]`);
                        const nglV = Number(g("ngl").value);
                        const start = el.dataset.start !== "0";
                        await call("POST", `${P}/servers`, {
                            tier: g("tier").value,
                            modelId: e.id,
                            model: e.path,
                            mmproj: e.mmproj || undefined,
                            ctx: Number(g("ctx").value),
                            parallel: Number(g("parallel")?.value) || undefined,
                            ngl: nglV,
                            gpu: nglV > 0 ? g("gpu").value.trim() : "",
                            alias: g("alias").value.trim() || undefined,
                            start,
                        });
                        openAdd = null;
                        frozen = !!openEditor;
                    }
                } catch (e) {
                    alert(e.message);
                } finally {
                    el.disabled = false;
                    el.textContent = prev;
                    setTimeout(load, act === "restart-agent" ? 2500 : 500);
                }
            });

            document.body.addEventListener("focusin", (ev) => {
                if (ev.target.closest?.(".res-edit, .editor")) {
                    frozen = true;
                }
            });
            document.body.addEventListener("focusout", (ev) => {
                // 같은 편집 영역으로 포커스가 이동하면 유지
                setTimeout(() => {
                    const a = document.activeElement;
                    if (a?.closest?.(".res-edit, .editor, .add-form")) {
                        frozen = true;
                        return;
                    }
                    frozen = !!openAdd || !!openEditor;
                }, 0);
            });

            document.body.addEventListener("keydown", (ev) => {
                if (ev.key !== "Enter") return;
                const inp = ev.target.closest?.('[data-f="skill-in"]');
                if (!inp) return;
                ev.preventDefault();
                inp.closest(".editor")?.querySelector('[data-act="add-skill"]')?.click();
            });

            document.body.addEventListener("change", (ev) => {
                const f = ev.target.closest("[data-f]");
                if (!f) return;
                const form = ev.target.closest(".add-form");
                if (!form) return;
                const id = form.dataset.id;
                if (f.dataset.f === "tier") populateModels(id);
                else if (f.dataset.f === "model") syncDefaults(id);
                else if (["ngl", "ctx", "parallel", "gpu"].includes(f.dataset.f)) estimate(id);
            });

            load();
            setInterval(load, 2000);
        </script>
        <script src="/nav.js"></script>
    </body>
</html>
