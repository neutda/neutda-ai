<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>neutda-ai · 서버 모니터링</title>
        <link rel="stylesheet" href="/dashboard.css" />
        <style>
            /* ===== 부하 스냅샷 컨트롤 바 ===== */
            .snap-bar {
                display: flex;
                align-items: center;
                gap: 10px;
                flex-wrap: wrap;
                background: var(--card, #161b22);
                border: 1px solid var(--border, #30363d);
                border-left: 3px solid var(--accent, #6c8cff);
                border-radius: 10px;
                padding: 10px 14px;
                margin: 14px 20px 4px;
            }
            .snap-title {
                font-weight: 700;
                font-size: 14px;
                white-space: nowrap;
            }
            .snap-bar input {
                flex: 1 1 240px;
                min-width: 180px;
                background: var(--bg, #0d1117);
                border: 1px solid var(--border, #30363d);
                border-radius: 8px;
                color: inherit;
                padding: 7px 10px;
                font-size: 13px;
            }
            .snap-btn {
                border: 0;
                border-radius: 8px;
                padding: 8px 14px;
                font-size: 13px;
                font-weight: 700;
                cursor: pointer;
                white-space: nowrap;
            }
            .snap-btn.start {
                background: #238636;
                color: #fff;
            }
            .snap-btn.start:hover {
                background: #2ea043;
            }
            .snap-btn.stop {
                background: #da3633;
                color: #fff;
            }
            .snap-btn.stop:hover {
                background: #f85149;
            }
            .snap-btn:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }
            .snap-rec {
                display: flex;
                align-items: center;
                gap: 10px;
                flex-wrap: wrap;
                flex: 1 1 auto;
            }
            .snap-dot {
                width: 12px;
                height: 12px;
                border-radius: 50%;
                background: #da3633;
                box-shadow: 0 0 0 0 rgba(218, 54, 51, 0.6);
                animation: snapPulse 1.2s infinite;
            }
            @keyframes snapPulse {
                0% {
                    box-shadow: 0 0 0 0 rgba(218, 54, 51, 0.6);
                }
                70% {
                    box-shadow: 0 0 0 8px rgba(218, 54, 51, 0);
                }
                100% {
                    box-shadow: 0 0 0 0 rgba(218, 54, 51, 0);
                }
            }
            .snap-recinfo {
                font-size: 13px;
                font-weight: 600;
            }
            .snap-recinfo b {
                color: var(--accent, #6c8cff);
            }
            .snap-link {
                color: var(--muted, #8b949e);
                font-size: 12px;
                cursor: pointer;
                text-decoration: none;
                white-space: nowrap;
            }
            .snap-link:hover {
                color: var(--accent, #6c8cff);
            }
            .snap-msg {
                flex-basis: 100%;
                font-size: 12px;
                color: var(--muted, #8b949e);
                min-height: 0;
            }
            .snap-msg.err {
                color: #f85149;
            }
            .snap-msg.ok {
                color: #3fb950;
            }
            /* 리포트/목록 모달 */
            .snap-modal {
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.6);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 1000;
                padding: 20px;
            }
            .snap-modal-box {
                background: var(--card, #161b22);
                border: 1px solid var(--border, #30363d);
                border-radius: 12px;
                width: min(880px, 100%);
                max-height: 86vh;
                display: flex;
                flex-direction: column;
            }
            .snap-modal-head {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 12px 16px;
                border-bottom: 1px solid var(--border, #30363d);
            }
            .snap-modal-head button {
                background: none;
                border: 0;
                color: var(--muted, #8b949e);
                font-size: 18px;
                cursor: pointer;
            }
            .snap-modal-body {
                padding: 16px;
                overflow: auto;
            }
            .snap-modal-body h4 {
                margin: 16px 0 6px;
                font-size: 13px;
                color: var(--accent, #6c8cff);
            }
            .snap-modal-body h4:first-child {
                margin-top: 0;
            }
            .snap-tbl {
                width: 100%;
                border-collapse: collapse;
                font-size: 12px;
                margin-top: 4px;
            }
            .snap-tbl th,
            .snap-tbl td {
                border: 1px solid var(--border, #30363d);
                padding: 5px 8px;
                text-align: right;
            }
            .snap-tbl th:first-child,
            .snap-tbl td:first-child {
                text-align: left;
            }
            .snap-tbl th {
                background: rgba(108, 140, 255, 0.08);
                color: var(--muted, #8b949e);
                font-weight: 600;
            }
            .snap-list-row {
                display: flex;
                justify-content: space-between;
                gap: 10px;
                padding: 9px 10px;
                border: 1px solid var(--border, #30363d);
                border-radius: 8px;
                margin-bottom: 6px;
                cursor: pointer;
            }
            .snap-list-row:hover {
                border-color: var(--accent, #6c8cff);
            }
            .snap-list-row .meta {
                color: var(--muted, #8b949e);
                font-size: 12px;
            }
            /* ===== 서버별 모니터링 카드 ===== */
            .node-grid {
                display: grid;
                grid-template-columns: 1fr;
                gap: 14px;
            }
            .node-card {
                background: var(--card, #161b22);
                border: 1px solid var(--border, #30363d);
                border-radius: 12px;
                padding: 14px 16px;
            }
            .node-card.parent {
                border-color: rgba(108, 140, 255, 0.45);
                box-shadow: 0 0 0 1px rgba(108, 140, 255, 0.12);
            }
            .node-head {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
                flex-wrap: wrap;
                margin-bottom: 4px;
            }
            .node-head .id {
                font-weight: 700;
                font-size: 15px;
            }
            .node-head .host {
                color: var(--muted, #8b949e);
                font-size: 12px;
                margin-left: 6px;
            }
            .node-head .tag {
                font-size: 11px;
                color: var(--accent, #6c8cff);
                background: rgba(108, 140, 255, 0.12);
                border-radius: 999px;
                padding: 2px 8px;
                margin-left: 8px;
            }
            .node-live {
                display: flex;
                gap: 10px;
                align-items: stretch;
                margin: 12px 0 8px;
            }
            .node-live > [data-slot="metrics"] {
                flex: 1 1 58%;
                min-width: 0;
                display: flex;
                flex-direction: column;
            }
            .node-live .node-res {
                display: grid;
                grid-template-columns: minmax(120px, 0.34fr) minmax(0, 1fr);
                gap: 8px;
                margin: 0;
                flex: 1 1 auto;
                align-self: stretch;
                align-items: stretch;
                min-height: 0;
                width: 100%;
            }
            .node-live .node-res .res-gpus {
                display: grid;
                grid-template-columns: 1fr;
                gap: 8px;
                min-width: 0;
                min-height: 0;
                align-content: stretch;
                align-items: stretch;
            }
            /* GPU 2~4장: 2열 카드 */
            .node-live[data-gpus="2"] .res-gpus,
            .node-live[data-gpus="3"] .res-gpus,
            .node-live[data-gpus="4"] .res-gpus {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
            .node-live[data-gpus="3"] .res-gpus > .res:last-child:nth-child(3) {
                grid-column: 1 / -1;
            }
            /* 5장↑ 또는 공간이 부족하면 차트는 아래로 */
            .node-live.gpus-many {
                flex-wrap: wrap;
            }
            .node-live.gpus-many > [data-slot="metrics"] {
                flex: 1 1 100%;
            }
            .node-live.gpus-many .chart-wrap {
                flex: 1 1 100%;
                min-height: 160px;
            }
            .node-live.gpus-many .res-gpus {
                grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            }
            .node-live .node-res .res-sys {
                display: flex;
                flex-direction: column;
                gap: 8px;
                min-width: 0;
                min-height: 0;
                align-self: stretch;
            }
            .node-live .node-res .res {
                width: auto;
                min-width: 0;
                padding: 10px 14px;
                box-sizing: border-box;
            }
            .node-live .node-res .res-sys .res {
                flex: 1 1 0;
                min-height: 0;
            }
            .node-live .node-res .res-gpus > .res {
                min-height: 0;
                height: 100%;
                display: flex;
                flex-direction: column;
            }
            .node-live .node-res .res-gpus > .res .gpu-procs {
                flex: 1 1 auto;
            }
            .node-live .node-res .res .pct {
                font-size: 16px;
            }
            .node-live .node-res .res .sub {
                font-size: 11px;
                gap: 2px 8px;
            }
            /* GPU: VRAM 점유 · 사용률을 나란히 */
            .gpu-dual {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
                margin-top: 4px;
            }
            .gpu-dual .gm-head {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                font-size: 11px;
                color: var(--muted, #8b949e);
                margin-bottom: 2px;
            }
            .gpu-dual .gm-head b {
                font-size: 15px;
                font-weight: 700;
                font-variant-numeric: tabular-nums;
                color: var(--text, #e6edf3);
            }
            .gpu-dual .meter {
                margin: 4px 0 0;
            }
            .gpu-dual .gpu-procs {
                grid-column: 1 / -1;
                margin-top: 4px;
            }
            .gpu-dual .gm-util .meter > span {
                background: #3fb950;
            }
            .gpu-dual .gm-util .meter.warn > span {
                background: #d29922;
            }
            .gpu-dual .gm-util .meter.crit > span {
                background: #f85149;
            }
            .node-live .chart-wrap {
                flex: 1 1 42%;
                min-width: 0;
                margin: 0;
                margin-top: 0;
                padding: 10px 12px;
                display: flex;
                flex-direction: column;
                box-sizing: border-box;
                min-height: 160px;
                align-self: stretch;
                overflow: hidden;
            }
            .node-live .chart-legend {
                margin-bottom: 6px;
                gap: 12px;
                flex-wrap: wrap;
                flex: 0 0 auto;
            }
            .node-live .chart-canvas-box {
                flex: 1 1 auto;
                min-height: 160px;
                position: relative;
                width: 100%;
            }
            .node-live canvas[data-chart] {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                display: block;
            }
            @media (max-width: 1100px) {
                .node-live[data-gpus="2"] .res-gpus {
                    grid-template-columns: 1fr;
                }
            }
            @media (max-width: 960px) {
                .node-live {
                    flex-direction: column;
                }
                .node-live .node-res {
                    grid-template-columns: 1fr;
                }
                .node-live .node-res .res-sys {
                    flex-direction: row;
                }
                .node-live .node-res .res-sys .res {
                    flex: 1 1 0;
                }
                .node-live[data-gpus="2"] .res-gpus,
                .node-live[data-gpus="3"] .res-gpus,
                .node-live[data-gpus="4"] .res-gpus {
                    grid-template-columns: 1fr;
                }
                .node-live .chart-canvas-box {
                    min-height: 160px;
                }
            }
            .node-servers {
                min-width: 0 !important;
                width: 100%;
                border-collapse: collapse;
                font-size: 12px;
                margin-top: 6px;
            }
            .node-servers td,
            .node-servers th {
                padding: 5px 7px;
                border-top: 1px solid var(--border, #30363d);
                text-align: left;
                white-space: nowrap;
            }
            .node-servers th {
                color: var(--muted, #8b949e);
                font-weight: 500;
                border-top: 0;
            }
            .node-servers .num {
                text-align: right;
                font-variant-numeric: tabular-nums;
            }
            .node-servers .roles {
                white-space: nowrap;
                max-width: none;
                line-height: 1.2;
            }
            .node-servers .roles .role-ro {
                font-size: 10px;
                padding: 1px 6px;
                margin-right: 3px;
                vertical-align: middle;
            }
            .node-servers .err {
                max-width: 160px;
                overflow: hidden;
                text-overflow: ellipsis;
                color: var(--err, #f85149);
            }
            .node-empty {
                font-size: 12px;
                color: var(--muted, #8b949e);
                padding: 6px 2px;
            }
            .table-scroll-soft {
                overflow-x: auto;
                margin: 0 -4px;
                padding: 0 4px;
            }

            /* 헤더 요약 카운트 */
            .hdr-stats {
                display: flex;
                align-items: center;
                gap: 4px 2px;
                flex-wrap: wrap;
                flex: 1 1 auto;
                min-width: 0;
                justify-content: flex-end;
            }
            .hdr-stat {
                display: inline-flex;
                align-items: baseline;
                gap: 5px;
                padding: 3px 8px;
                border-radius: 999px;
                background: rgba(255, 255, 255, 0.04);
                border: 1px solid var(--border, #30363d);
                font-size: 12px;
                line-height: 1.3;
                white-space: nowrap;
            }
            .hdr-stat .hk {
                color: var(--muted, #8b949e);
                font-weight: 500;
            }
            .hdr-stat .hv {
                font-weight: 700;
                font-variant-numeric: tabular-nums;
            }
            .hdr-stat .hv.ok {
                color: var(--ok, #3fb950);
            }
            .hdr-stat .hv.warn {
                color: var(--warn, #d29922);
            }
            .hdr-stat .hv.err {
                color: var(--err, #f85149);
            }
            .hdr-stat .hv.accent {
                color: var(--accent, #6c8cff);
            }
            .hdr-sep {
                width: 1px;
                height: 14px;
                background: var(--border, #30363d);
                margin: 0 4px;
                flex: 0 0 auto;
            }
            header.mon-head {
                gap: 10px 16px;
            }
            header.mon-head h1 {
                flex: 0 0 auto;
            }
            header.mon-head .tools {
                flex: 0 0 auto;
            }

            /* ===== 좌:서버 / 우:부하 (각자 스크롤, 겹침 방지) ===== */
            .app-main {
                display: flex;
                flex-direction: column;
                overflow: hidden;
                min-height: 0;
            }
            .monitor-split {
                flex: 1 1 auto;
                min-height: 0;
                display: grid;
                grid-template-columns: minmax(0, 1.55fr) minmax(280px, 0.75fr);
                gap: 16px;
                align-items: stretch;
                overflow: hidden;
            }
            .monitor-col {
                display: flex;
                flex-direction: column;
                min-width: 0;
                min-height: 0;
                height: 100%;
                overflow: hidden;
                border: 1px solid var(--border, #30363d);
                border-radius: 12px;
                background: rgba(13, 15, 21, 0.35);
            }
            /* 왼쪽 서버 상태: 좁은 폭에서 차트 잘림 방지 → 메트릭 위 / 차트 아래 */
            .monitor-col:not(.load-side) .node-live {
                flex-direction: column;
                align-items: stretch;
            }
            .monitor-col:not(.load-side) .node-live > [data-slot="metrics"] {
                flex: 0 0 auto;
                width: 100%;
            }
            .monitor-col:not(.load-side) .node-live .chart-wrap {
                flex: 0 0 auto;
                width: 100%;
                min-width: 0;
                min-height: 200px;
                height: 220px;
            }
            .monitor-col:not(.load-side) .node-card {
                overflow: hidden;
                max-width: 100%;
            }
            .monitor-col:not(.load-side) .node-live .node-res {
                grid-template-columns: minmax(110px, 0.32fr) minmax(0, 1fr);
            }
            .monitor-col > .sec-head {
                display: flex;
                align-items: baseline;
                justify-content: space-between;
                gap: 10px;
                flex-wrap: wrap;
                flex: 0 0 auto;
                margin: 0;
                padding: 12px 14px 10px;
                border-bottom: 1px solid var(--border, #30363d);
                background: var(--card, #161b22);
                border-radius: 12px 12px 0 0;
            }
            .monitor-col > .sec-head h2 {
                margin: 0;
                font-size: 15px;
            }
            .monitor-col-scroll {
                flex: 1 1 auto;
                min-height: 0;
                overflow-x: hidden;
                overflow-y: auto;
                padding: 12px 14px 16px;
                overscroll-behavior: contain;
            }
            .load-side .monitor-col-scroll {
                overflow: hidden;
                display: flex;
                flex-direction: column;
                padding: 10px 12px 12px;
            }
            .load-glance {
                flex: 1 1 auto;
                min-height: 0;
                display: flex;
                flex-direction: column;
                gap: 10px;
                overflow: hidden;
            }
            .lg-hero {
                display: grid;
                grid-template-columns: 1fr auto;
                gap: 10px;
                align-items: center;
                padding: 12px 14px;
                border-radius: 12px;
                border: 1px solid var(--border, #30363d);
                background: var(--card, #161b22);
                position: relative;
                overflow: hidden;
            }
            .lg-hero::before {
                content: "";
                position: absolute;
                inset: 0;
                opacity: 0.14;
                pointer-events: none;
                background: radial-gradient(
                    120% 90% at 0% 0%,
                    var(--load-glow, #6c8cff),
                    transparent 55%
                );
            }
            .lg-hero[data-load="idle"] {
                --load-glow: #3fb950;
            }
            .lg-hero[data-load="normal"] {
                --load-glow: #6c8cff;
            }
            .lg-hero[data-load="busy"] {
                --load-glow: #d29922;
            }
            .lg-hero .lg-main {
                position: relative;
                z-index: 1;
            }
            .lg-hero .lg-label {
                font-size: 11px;
                color: var(--muted, #8b949e);
                margin-bottom: 2px;
            }
            .lg-hero .lg-num {
                font-size: 32px;
                font-weight: 750;
                font-variant-numeric: tabular-nums;
                line-height: 1.05;
                letter-spacing: -0.03em;
            }
            .lg-hero .lg-num span {
                font-size: 15px;
                font-weight: 600;
                color: var(--muted, #8b949e);
                margin-left: 2px;
            }
            .lg-hero .lg-eq {
                margin-top: 4px;
                font-size: 12px;
                color: var(--muted, #8b949e);
            }
            .lg-hero .lg-eq b {
                color: var(--text, #e6edf3);
                font-weight: 700;
            }
            .lg-hero .lg-badge {
                position: relative;
                z-index: 1;
                text-align: right;
            }
            .lg-strip {
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 8px;
            }
            .lg-cell {
                background: var(--card, #161b22);
                border: 1px solid var(--border, #30363d);
                border-radius: 10px;
                padding: 8px 10px;
                min-width: 0;
            }
            .lg-cell .lk {
                font-size: 10px;
                color: var(--muted, #8b949e);
            }
            .lg-cell .lv {
                font-size: 18px;
                font-weight: 700;
                font-variant-numeric: tabular-nums;
                margin-top: 2px;
                line-height: 1.15;
            }
            .lg-cell .lv.warn {
                color: var(--warn, #d29922);
            }
            .lg-cell .lv.ok {
                color: var(--ok, #3fb950);
            }
            .lg-cell .lv.accent {
                color: var(--accent, #6c8cff);
            }
            .lg-meter {
                height: 6px;
                border-radius: 999px;
                background: #0d0f15;
                border: 1px solid var(--border, #30363d);
                overflow: hidden;
                margin-top: 6px;
            }
            .lg-meter > span {
                display: block;
                height: 100%;
                border-radius: 999px;
            }
            .lg-meter.tone-ok > span {
                background: #3fb950;
            }
            .lg-meter.tone-accent > span {
                background: #6c8cff;
            }
            .lg-meter.tone-warn > span {
                background: #d29922;
            }
            .lg-meter.tone-err > span {
                background: #f85149;
            }
            .lg-slots {
                display: flex;
                flex-wrap: wrap;
                gap: 4px;
                padding: 0 2px;
            }
            .lg-slots .slot {
                width: 12px;
                height: 18px;
                border-radius: 3px;
                background: #0d0f15;
                border: 1px solid var(--border, #30363d);
            }
            .lg-slots .slot.on {
                background: var(--accent, #6c8cff);
                border-color: transparent;
            }
            .lg-slots .slot.wait {
                background: var(--warn, #d29922);
                border-color: transparent;
            }
            .lg-backends {
                display: flex;
                flex-direction: column;
                gap: 6px;
            }
            .lg-be {
                display: grid;
                grid-template-columns: minmax(0, 1fr) 48px;
                gap: 6px 8px;
                align-items: center;
                font-size: 11px;
            }
            .lg-be .nm {
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                color: var(--muted, #8b949e);
            }
            .lg-be .nm b {
                color: var(--text, #e6edf3);
                font-weight: 600;
            }
            .lg-be .pct {
                text-align: right;
                font-variant-numeric: tabular-nums;
                font-weight: 700;
            }
            .lg-be .bar {
                grid-column: 1 / -1;
                height: 5px;
                border-radius: 999px;
                background: #0d0f15;
                border: 1px solid var(--border, #30363d);
                overflow: hidden;
            }
            .lg-be .bar > span {
                display: block;
                height: 100%;
                background: var(--accent, #6c8cff);
            }
            .lg-jobs {
                flex: 1 1 auto;
                min-height: 0;
                display: flex;
                flex-direction: column;
                gap: 6px;
                overflow: hidden;
                border-top: 1px solid var(--border, #30363d);

            .lg-tab {

            .lg-slots,

                flex: 0 0 auto;

            .lg-job {
                display: grid;
                grid-template-columns: auto minmax(0, 1fr) auto;
                gap: 6px;
                align-items: center;
                font-size: 11px;
                padding: 5px 7px;
                border-radius: 7px;
                background: #0d0f15;
                border: 1px solid var(--border, #30363d);

                font-size: 10px;
                font-weight: 700;
                padding: 1px 5px;
                border-radius: 999px;

            .lg-job .tag.run {
                background: rgba(108, 140, 255, 0.18);
                color: var(--accent, #6c8cff);
            }
            .lg-job .tag.wait {
                background: rgba(210, 153, 34, 0.18);

            }
            .lg-job .tag.ok {
                background: rgba(63, 185, 80, 0.18);
                color: var(--ok, #3fb950);

                background: rgba(248, 81, 73, 0.18);
                color: #f85149;

                font-size: 10px;

            .lg-job .txt {
                overflow: hidden;
                text-overflow: ellipsis;

            .pill.load-idle {
                background: rgba(63, 185, 80, 0.15);
                color: var(--ok, #3fb950);
            }
            .pill.load-normal {
                background: rgba(108, 140, 255, 0.15);

            @media (max-width: 1100px) {

                color: var(--muted, #8b949e);

        </style>

    <body>
        <div class="wrap">

                <div class="hdr-stats" id="hdrStats" title="">
                    <span class="hdr-stat"

                    >
                    <span class="hdr-stat"
                        ><span class="hk">연결</span>

                    >
                    <span class="hdr-stat"
                        ><span class="hk">모델</span>

                    >

        <div class="snap-modal" id="snapModal" style="display: none">
            <div class="snap-modal-box">
                <div class="snap-modal-head">

                </div>
                <div class="snap-modal-body" id="snapModalBody"></div>
