<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>neutda-ai · 서버 모니터링</title>
        <link rel="stylesheet" href="/dashboard.css" />
        <style>
            table {
                min-width: 1280px;
            }
        </style>
    </head>
    <body>
        <div class="wrap">
            <header>
                <h1>
                    서버 모니터링
                    <span id="routeBadge" class="route-badge">–</span>
                </h1>
                <div><span id="updated" class="updated"></span></div>
            </header>

            <div class="summary">
                <div class="card">
                    <div class="k">백엔드</div>
                    <div class="v" id="sBackends">–</div>
                </div>
                <div class="card">
                    <div class="k">정상</div>
                    <div class="v" id="sHealthy" style="color: var(--ok)">
                        –
                    </div>
                </div>
                <div class="card">
                    <div class="k">진행 중(in-flight)</div>
                    <div class="v" id="sInflight">–</div>
                </div>
                <div class="card">
                    <div class="k">처리량(최근 1분)</div>
                    <div class="v" id="sRpm" style="color: var(--accent)">
                        –
                    </div>
                </div>
                <div class="card">
                    <div class="k">총 요청</div>
                    <div class="v" id="sTotal">–</div>
                </div>
                <div class="card">
                    <div class="k">총 오류</div>
                    <div class="v" id="sErrors" style="color: var(--err)">
                        –
                    </div>
                </div>
            </div>

            <h2 style="margin-top: 4px">실시간 시스템 자원</h2>
            <div class="res-grid" id="resGrid">
                <div class="res"><div class="muted">불러오는 중…</div></div>
            </div>

            <div class="chart-wrap">
                <div class="chart-legend" id="chartLegend"></div>
                <canvas id="resChart"></canvas>
            </div>

            <h2>
                티어 라우팅 효과
                <span class="muted" id="svSince" style="font-weight: 400"></span>
            </h2>
            <div class="savings-grid">
                <div class="card">
                    <div class="k">연산량 절감 (전부 large 처리 대비)</div>
                    <div class="v" id="svSaved" style="color: var(--ok)">–</div>
                    <div class="muted" id="svSavedSub" style="margin-top: 4px"></div>
                </div>
                <div class="card">
                    <div class="k">누적 처리 토큰</div>
                    <div class="v" id="svTokens">–</div>
                    <div class="muted" id="svTokensSub" style="margin-top: 4px"></div>
                </div>
                <div class="card">
                    <div class="k">티어별 요청 분포</div>
                    <div class="tier-dist" id="tierDist"></div>
                    <div class="tier-legend" id="tierLegend"></div>
                </div>
            </div>

            <h2>백엔드 상태</h2>
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>백엔드</th>
                            <th>별칭</th>
                            <th>티어</th>
                            <th>장치</th>
                            <th>역할</th>
                            <th>모델</th>
                            <th>상태</th>
                            <th>프로세스</th>
                            <th class="num">진행 중</th>
                            <th class="num">라우팅</th>
                            <th class="num">채팅</th>
                            <th class="num">오류</th>
                            <th class="num">평균(ms)</th>
                            <th class="num">헬스(ms)</th>
                            <th>비고</th>
                        </tr>
                    </thead>
                    <tbody id="rows">
                        <tr>
                            <td colspan="15" class="muted">불러오는 중…</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <p class="muted" id="hint" style="margin-top: 14px"></p>
        </div>

        <script>
            const $ = (id) => document.getElementById(id);
            const COLS = 15;

            function escAttr(s) {
                return String(s ?? "")
                    .replace(/&/g, "&amp;")
                    .replace(/"/g, "&quot;");
            }

            function roleBadges(b) {
                const r = b.roles || {};
                const items = [
                    [
                        "solve",
                        "해결",
                        r.solve ?? r.chat ?? b.solveEnabled ?? b.chatEnabled,
                    ],
                    ["router", "라우터", r.router ?? b.routerEnabled],
                    ["planner", "설계", r.planner ?? b.plannerEnabled],
                    ["embedding", "임베딩", r.embedding ?? b.embeddingEnabled],
                    ["security", "보안검증", r.security ?? b.securityEnabled],
                ];
                return items
                    .map(
                        ([, label, on]) =>
                            `<span class="role-ro ${on ? "on" : ""}">${label}</span>`,
                    )
                    .join("");
            }

            async function refresh() {
                try {
                    const [r, rs] = await Promise.all([
                        fetch("/api/status"),
                        fetch("/api/servers").catch(() => null),
                    ]);
                    const s = await r.json();
                    let servers = [];
                    try {
                        servers = (await rs?.json())?.servers ?? [];
                    } catch {}
                    const svByUrl = new Map(servers.map((x) => [x.url, x]));

                    $("sBackends").textContent = s.totalBackends;
                    $("sHealthy").textContent = s.healthyBackends;
                    $("sInflight").textContent = s.totalInFlight;
                    $("sRpm").textContent = s.requestsLastMin ?? "–";
                    $("sTotal").textContent = s.totalRequests;
                    $("sErrors").textContent = s.totalErrors;

                    renderSavings(s.stats);

                    const eff = s.routing?.effectiveMode ?? "heuristic";
                    const badge = $("routeBadge");
                    badge.textContent =
                        eff === "llm"
                            ? "티어 판정: LLM 라우터"
                            : "티어 판정: 글자수 휴리스틱";
                    badge.className =
                        "route-badge" + (eff === "llm" ? "" : " heuristic");

                    const maxLoad = Math.max(
                        1,
                        ...s.backends.map((b) => b.inFlight),
                    );
                    const tierRank = { large: 0, medium: 1, small: 2 };
                    const backends = [...s.backends].sort((a, b) => {
                        const ta = tierRank[a.tier] ?? 9;
                        const tb = tierRank[b.tier] ?? 9;
                        if (ta !== tb) return ta - tb;
                        const ga = a.device === "gpu" ? 0 : 1;
                        const gb = b.device === "gpu" ? 0 : 1;
                        if (ga !== gb) return ga - gb;
                        return String(a.url).localeCompare(String(b.url));
                    });
                    $("rows").innerHTML = backends
                        .map((b) => {
                            const sv = svByUrl.get(b.url);
                            let proc = '<span class="muted">–</span>';
                            if (sv) {
                                proc =
                                    sv.running && !b.healthy
                                        ? '<span class="pw-loading">로딩중…</span>'
                                        : `<span class="pw-state" style="margin-left:0">${sv.running ? "ON" : "OFF"}</span>`;
                                if (!sv.running && sv.startError) {
                                    proc += `<span class="start-err" title="${escAttr(sv.startError)}">${escAttr(sv.startError)}</span>`;
                                }
                            }
                            return `
          <tr>
            <td>${b.url}</td>
            <td>${escAttr(sv?.alias || sv?.name || b.alias || "–")}</td>
            <td><span class="tier tier-${b.tier}">${b.tier ?? "–"}</span></td>
            <td><span class="dev dev-${b.device || "na"}">${b.device ? b.device.toUpperCase() : "–"}</span></td>
            <td>${roleBadges(b)}</td>
            <td class="model" title="${b.model ?? ""}">${b.model ? b.model.split(/[\\/]/).pop() : '<span class="muted">–</span>'}</td>
            <td><span class="pill ${b.healthy ? "up" : "down"}"><span class="dot"></span>${b.healthy ? "정상" : "다운"}</span></td>
            <td>${proc}</td>
            <td class="num">${b.inFlight}<div class="bar"><span style="width:${(b.inFlight / maxLoad) * 100}%"></span></div></td>
            <td class="num">${b.routerRequests ?? 0}</td>
            <td class="num">${b.chatRequests ?? 0}</td>
            <td class="num">${b.totalErrors}</td>
            <td class="num">${b.avgLatencyMs ?? "–"}</td>
            <td class="num">${b.healthLatencyMs ?? "–"}</td>
            <td class="err" title="${b.lastError ?? ""}">${b.lastError ?? ""}</td>
          </tr>`;
                        })
                        .join("");

                    $("hint").innerHTML =
                        s.healthyBackends === 0
                            ? '정상 백엔드가 없습니다. <a href="/models.html">모델 관리</a> 에서 모델 서버를 추가하거나 전원을 켜세요.'
                            : eff === "heuristic"
                              ? '라우터 역할이 모두 꺼져 있어 글자수·키워드 휴리스틱으로 티어를 판정합니다. <a href="/models.html">모델 관리</a> 에서 라우터 토글을 켜세요.'
                              : "";
                    $("updated").textContent =
                        "갱신 " + new Date().toLocaleTimeString();
                } catch (e) {
                    $("rows").innerHTML =
                        `<tr><td colspan="${COLS}" class="err">상태 조회 실패: ${e.message}</td></tr>`;
                }
            }

            // ===== 티어 라우팅 효과 (절감 통계) =====
            const TIER_COLORS = {
                small: "var(--warn)",
                medium: "var(--ok)",
                large: "var(--accent)",
            };
            const fmt = (n) => Number(n ?? 0).toLocaleString("ko-KR");

            function renderSavings(st) {
                if (!st) return;
                const sv = st.savings || {};
                // 토큰 기준 절감률 우선, 없으면 요청 수 기준
                const pct = sv.savedPctTokens ?? sv.savedPctRequests;
                $("svSaved").textContent = pct == null ? "–" : pct + "%";
                $("svSavedSub").textContent =
                    pct == null
                        ? "아직 처리된 요청이 없습니다."
                        : sv.savedPctTokens != null
                          ? `토큰 가중 기준 · 요청 수 기준 ${sv.savedPctRequests}%`
                          : "요청 수 기준 (토큰 usage 미집계)";
                $("svTokens").textContent = fmt(st.totals?.tokens);
                $("svTokensSub").textContent =
                    st.totals?.tokens > 0
                        ? `large 환산 시 약 ${fmt(sv.largeEquivalentTokens)} 토큰 상당`
                        : "";
                $("svSince").textContent = st.since
                    ? `(${new Date(st.since).toLocaleDateString("ko-KR")} 부터 누적)`
                    : "";

                const tiers = st.tiers || {};
                const totalReq = st.totals?.requests || 0;
                const order = ["small", "medium", "large"];
                $("tierDist").innerHTML = order
                    .map((t) => {
                        const req = tiers[t]?.requests || 0;
                        const w = totalReq ? (req / totalReq) * 100 : 0;
                        return `<span class="seg-${t}" style="width:${w}%" title="${t}: ${fmt(req)}건"></span>`;
                    })
                    .join("");
                $("tierLegend").innerHTML = order
                    .map((t) => {
                        const req = tiers[t]?.requests || 0;
                        const p = totalReq
                            ? Math.round((req / totalReq) * 100)
                            : 0;
                        return `<span><span class="sw" style="background:${TIER_COLORS[t]}"></span>${t} <b>${fmt(req)}건 (${p}%)</b></span>`;
                    })
                    .join("");
            }

            refresh();
            setInterval(refresh, 1000);

            function meterClass(pct) {
                return pct >= 90
                    ? "meter crit"
                    : pct >= 70
                      ? "meter warn"
                      : "meter";
            }
            function resCard(name, sub, pct, extra) {
                return `<div class="res">
        <div class="top"><div class="name">${name} ${extra ? `<small>${extra}</small>` : ""}</div><div class="pct">${pct == null ? "–" : pct + "%"}</div></div>
        <div class="${meterClass(pct ?? 0)}"><span style="width:${pct ?? 0}%"></span></div>
        <div class="sub">${sub}</div>
      </div>`;
            }
            const gb = (mb) => (mb / 1024).toFixed(1) + " GB";

            async function refreshMetrics() {
                try {
                    const m = await (await fetch("/api/metrics")).json();
                    const cards = [];
                    for (const g of m.gpus || []) {
                        const sub = [
                            `VRAM ${gb(g.memUsedMb)} / ${gb(g.memTotalMb)}`,
                            g.tempC != null ? `${g.tempC}°C` : null,
                            g.powerW != null ? `${g.powerW} W` : null,
                            `사용률 ${g.utilPct}%`,
                        ]
                            .filter(Boolean)
                            .join(" · ");
                        cards.push(
                            resCard(
                                `GPU${g.index} <small>${g.name}</small>`,
                                sub,
                                g.memUsagePct,
                                "VRAM",
                            ),
                        );
                    }
                    if (!(m.gpus || []).length) {
                        cards.push(
                            `<div class="res"><div class="name">GPU</div><div class="sub" style="margin-top:8px">nvidia-smi 사용 불가</div></div>`,
                        );
                    }
                    cards.push(
                        resCard(
                            "CPU",
                            `${m.cpu.cores} 코어 · ${m.cpu.model}`,
                            m.cpu.usagePct,
                        ),
                    );
                    cards.push(
                        resCard(
                            "RAM",
                            `${gb(m.mem.usedMb)} / ${gb(m.mem.totalMb)} (여유 ${gb(m.mem.freeMb)})`,
                            m.mem.usagePct,
                        ),
                    );
                    $("resGrid").innerHTML = cards.join("");

                    const g0 = (m.gpus || [])[0];
                    pushPoint("vram", g0 ? g0.memUsagePct : null);
                    pushPoint("util", g0 ? g0.utilPct : null);
                    pushPoint("cpu", m.cpu.usagePct);
                    pushPoint("ram", m.mem.usagePct);
                    drawChart();
                } catch (e) {
                    $("resGrid").innerHTML =
                        `<div class="res"><div class="err">자원 조회 실패: ${e.message}</div></div>`;
                }
            }

            // ===== 실시간 라인 그래프 =====
            const SERIES = [
                { key: "vram", label: "GPU VRAM", color: "#6c8cff" },
                { key: "util", label: "GPU 사용률", color: "#3fb950" },
                { key: "cpu", label: "CPU", color: "#d29922" },
                { key: "ram", label: "RAM", color: "#f85149" },
            ];
            const MAXP = 60; // 최근 60 샘플 유지
            const hist = { vram: [], util: [], cpu: [], ram: [] };
            function pushPoint(key, val) {
                const arr = hist[key];
                arr.push(typeof val === "number" && isFinite(val) ? val : null);
                if (arr.length > MAXP) arr.shift();
            }

            function drawChart() {
                const cv = $("resChart");
                const dpr = window.devicePixelRatio || 1;
                const cssW = cv.clientWidth || 600;
                const cssH = cv.clientHeight || 220;
                cv.width = Math.round(cssW * dpr);
                cv.height = Math.round(cssH * dpr);
                const ctx = cv.getContext("2d");
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                ctx.clearRect(0, 0, cssW, cssH);

                const padL = 34,
                    padR = 10,
                    padT = 10,
                    padB = 18;
                const plotW = cssW - padL - padR;
                const plotH = cssH - padT - padB;
                const yOf = (v) => padT + (1 - v / 100) * plotH;
                const xOf = (i) =>
                    padL + (MAXP === 1 ? 0 : (i / (MAXP - 1)) * plotW);

                // 그리드 + Y 라벨
                ctx.font = "10px ui-sans-serif,system-ui";
                ctx.textBaseline = "middle";
                for (let v = 0; v <= 100; v += 25) {
                    const y = yOf(v);
                    ctx.strokeStyle = "#212533";
                    ctx.beginPath();
                    ctx.moveTo(padL, y);
                    ctx.lineTo(cssW - padR, y);
                    ctx.stroke();
                    ctx.fillStyle = "#6b7280";
                    ctx.textAlign = "right";
                    ctx.fillText(v + "%", padL - 6, y);
                }

                // 시리즈 라인
                for (const s of SERIES) {
                    const arr = hist[s.key];
                    const offset = MAXP - arr.length; // 오른쪽 정렬(최신이 우측)
                    ctx.strokeStyle = s.color;
                    ctx.lineWidth = 1.8;
                    ctx.beginPath();
                    let started = false;
                    for (let i = 0; i < arr.length; i++) {
                        const v = arr[i];
                        if (v == null) {
                            started = false;
                            continue;
                        }
                        const x = xOf(offset + i);
                        const y = yOf(v);
                        if (!started) {
                            ctx.moveTo(x, y);
                            started = true;
                        } else ctx.lineTo(x, y);
                    }
                    ctx.stroke();
                }

                // 범례(현재값 포함)
                $("chartLegend").innerHTML = SERIES.map((s) => {
                    const arr = hist[s.key];
                    const last = arr.length ? arr[arr.length - 1] : null;
                    return `<span class="lg"><span class="sw" style="background:${s.color}"></span>${s.label} <b>${last == null ? "–" : last + "%"}</b></span>`;
                }).join("");
            }

            refreshMetrics();
            setInterval(refreshMetrics, 1000);
        </script>
        <script src="/nav.js"></script>
    </body>
</html>
